name: Linux package builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build and bundle
        run: |
          flatpak-builder --user --force-clean --repo=repo --default-branch=stable --install-deps-from=flathub build-dir flatpak/io.github.fastrizwaan.TeddyNotes.yaml
          flatpak build-bundle repo TeddyNotes-1.7-x86_64.flatpak io.github.fastrizwaan.TeddyNotes stable
      - uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-1.7-Flatpak-x86_64
          path: TeddyNotes-1.7-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file fuse libfuse2 gettext gobject-introspection \
            libadwaita-1-dev libgirepository-2.0-dev libgtk-4-dev \
            libwebkitgtk-6.0-dev meson ninja-build python3-gi python3-cryptography \
            squashfs-tools
      - name: Install appimage-builder
        run: |
          sudo curl -L --fail --retry 3 \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
            -o /usr/local/bin/appimage-builder
          sudo chmod +x /usr/local/bin/appimage-builder
      - name: Build AppImage
        run: sudo env APPIMAGE_EXTRACT_AND_RUN=1 appimage-builder --recipe AppImageBuilder.yml --skip-test
      - name: Name artifact
        run: mv ./*.AppImage TeddyNotes-1.7-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-1.7-AppImage-x86_64
          path: TeddyNotes-1.7-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
