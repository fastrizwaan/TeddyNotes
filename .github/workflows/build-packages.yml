name: Linux package builds

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. 1.7)'
        required: false
        default: '1.7'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="1.7"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build and bundle
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          flatpak-builder --user --force-clean --repo=repo --default-branch=stable --install-deps-from=flathub build-dir flatpak/io.github.fastrizwaan.TeddyNotes.yaml
          flatpak build-bundle repo "TeddyNotes-${VERSION}-x86_64.flatpak" io.github.fastrizwaan.TeddyNotes stable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-${{ steps.get_version.outputs.version }}-Flatpak-x86_64
          path: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.flatpak

  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="1.7"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file fuse libfuse2t64 gettext gobject-introspection \
            libadwaita-1-dev libgirepository-2.0-dev libgtk-4-dev \
            libwebkitgtk-6.0-dev meson ninja-build python3-gi python3-cryptography \
            squashfs-tools gnupg dirmngr

      - name: Install appimage-builder
        run: |
          sudo curl -L --fail --retry 3 \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
            -o /usr/local/bin/appimage-builder
          sudo chmod +x /usr/local/bin/appimage-builder

      - name: Build AppImage
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/version: '[^']*'/version: '${VERSION}'/" AppImageBuilder.yml
          sudo env APPIMAGE_EXTRACT_AND_RUN=1 appimage-builder --recipe AppImageBuilder.yml --skip-test

      - name: Name artifact
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TARGET="TeddyNotes-${VERSION}-x86_64.AppImage"
          SRC=$(ls -1 *.AppImage 2>/dev/null | head -n 1)
          if [ -n "$SRC" ] && [ "$SRC" != "$TARGET" ]; then
            mv "$SRC" "$TARGET"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-${{ steps.get_version.outputs.version }}-AppImage-x86_64
          path: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.AppImage
