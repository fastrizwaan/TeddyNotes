name: Linux package builds

on:
  push:
    tags:
      - '*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. 1.7)'
        required: false
        default: '1.7'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="1.7"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build and bundle
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          flatpak-builder --user --force-clean --repo=repo --default-branch=stable --install-deps-from=flathub build-dir flatpak/io.github.fastrizwaan.TeddyNotes.yaml
          flatpak build-bundle repo "TeddyNotes-${VERSION}-x86_64.flatpak" io.github.fastrizwaan.TeddyNotes stable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-${{ steps.get_version.outputs.version }}-Flatpak-x86_64
          path: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.flatpak
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.flatpak

  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: get_version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="1.7"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install AppImage build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential curl file libfuse2t64 gettext gobject-introspection \
            libadwaita-1-dev libgirepository-2.0-dev libgtk-4-dev \
            libwebkitgtk-6.0-dev meson ninja-build python3-gi python3-cryptography \
            squashfs-tools gnupg dirmngr desktop-file-utils patchelf

      - name: Install appimage-builder
        run: |
          sudo curl -L --fail --retry 3 \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage \
            -o /usr/local/bin/appimage-builder
          sudo chmod +x /usr/local/bin/appimage-builder

      - name: Build AppImage
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          sed -i "s/version: '[^']*'/version: '${VERSION}'/" AppImageBuilder.yml
          sudo env APPIMAGE_EXTRACT_AND_RUN=1 appimage-builder --recipe AppImageBuilder.yml --skip-test

      - name: Patch and repack AppImage for WebKitGTK compatibility
        run: |
          APPIMAGE=$(ls -1 TeddyNotes-*.AppImage | head -n 1)
          ./"$APPIMAGE" --appimage-extract
          rm -f "$APPIMAGE"

          # 1. Compile WebKitGTK path hook into libapprun_hooks.so
          mv squashfs-root/lib/x86_64/libapprun_hooks.so squashfs-root/lib/x86_64/libapprun_hooks_orig.so
          cat << 'EOF' > /tmp/apprun_hooks_wrapper.c
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <dlfcn.h>

          __attribute__((constructor))
          static void init(void) {
              dlopen("libapprun_hooks_orig.so", RTLD_GLOBAL | RTLD_NOW);
          }

          void* g_subprocess_launcher_spawnv(void* self, char** argv, void** error) {
              static void* (*real_spawnv)(void*, char**, void**) = NULL;
              if (!real_spawnv) {
                  real_spawnv = dlsym(RTLD_NEXT, "g_subprocess_launcher_spawnv");
              }
              const char* appdir = getenv("APPDIR");
              if (appdir && argv) {
                  const char* prefix = "/usr/lib/x86_64-linux-gnu/webkitgtk-6.0";
                  size_t prefix_len = strlen(prefix);
                  for (int i = 0; argv[i] != NULL; i++) {
                      if (strncmp(argv[i], prefix, prefix_len) == 0) {
                          char* new_path = malloc(1024);
                          snprintf(new_path, 1024, "%s%s", appdir, argv[i]);
                          argv[i] = new_path;
                      }
                  }
              }
              return real_spawnv(self, argv, error);
          }

          void* dlopen(const char* filename, int flags) {
              static void* (*real_dlopen)(const char*, int) = NULL;
              if (!real_dlopen) {
                  real_dlopen = dlsym(RTLD_NEXT, "dlopen");
              }
              const char* appdir = getenv("APPDIR");
              if (appdir && filename) {
                  const char* prefix = "/usr/lib/x86_64-linux-gnu/webkitgtk-6.0";
                  size_t prefix_len = strlen(prefix);
                  if (strncmp(filename, prefix, prefix_len) == 0) {
                      char new_path[1024];
                      snprintf(new_path, sizeof(new_path), "%s%s", appdir, filename);
                      return real_dlopen(new_path, flags);
                  }
              }
              return real_dlopen(filename, flags);
          }
          EOF
          gcc -shared -fPIC -O2 /tmp/apprun_hooks_wrapper.c -o squashfs-root/lib/x86_64/libapprun_hooks.so -ldl

          # 2. Restore absolute PT_INTERP (/lib64/ld-linux-x86-64.so.2) on all binaries
          python3 -c "
          import os
          for root, dirs, files in os.walk('squashfs-root'):
              for file in files:
                  filepath = os.path.join(root, file)
                  if os.path.isfile(filepath) and not os.path.islink(filepath):
                      try:
                          with open(filepath, 'rb') as f:
                              data = f.read()
                          old_val = b'lib64/ld-linux-x86-64.so.2\x00'
                          new_val = b'/lib64/ld-linux-x86-64.so.2\x00'
                          if old_val in data:
                              data = data.replace(old_val, new_val)
                              with open(filepath, 'wb') as f:
                                  f.write(data)
                      except Exception:
                          pass
          "

          # 3. Add WebKit runtime variables to AppRun.env
          cat << 'EOF' >> squashfs-root/AppRun.env
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          WEBKIT_DISABLE_DMABUF_RENDERER=1
          WEBKIT_FORCE_SANDBOX=0
          EOF

          # 4. Download appimagetool and repack AppImage
          sudo curl -sL -o /usr/local/bin/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          VERSION="${{ steps.get_version.outputs.version }}"
          TARGET="TeddyNotes-${VERSION}-x86_64.AppImage"
          ARCH=x86_64 /usr/local/bin/appimagetool squashfs-root "$TARGET"
          chmod +x "$TARGET"
          rm -rf squashfs-root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeddyNotes-${{ steps.get_version.outputs.version }}-AppImage-x86_64
          path: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: TeddyNotes-${{ steps.get_version.outputs.version }}-x86_64.AppImage
