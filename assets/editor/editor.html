    function highlightTableCell(cell) {
      if (!cell) return;
      const existingMark = cell.querySelector('mark.stilo-highlight');
      if (existingMark) {
        const parent = existingMark.parentNode;
        while (existingMark.firstChild) {
          parent.insertBefore(existingMark.firstChild, existingMark);
        }
        parent.removeChild(existingMark);
        parent.normalize();
        return;
      }
      const validNodes = getValidCellNodes(cell);
      if (validNodes.length === 0) return;
      const cellRange = document.createRange();
      cellRange.setStart(validNodes[0], 0);
      const last = validNodes[validNodes.length - 1];
      const len = last.nodeType === Node.TEXT_NODE ? last.textContent.length : last.childNodes.length;
      cellRange.setEnd(last, len);

      const mark = document.createElement('mark');
      mark.className = 'stilo-highlight';
      try {
        cellRange.surroundContents(mark);
      } catch (_) {
        const frag = cellRange.extractContents();
        mark.appendChild(frag);
        cellRange.insertNode(mark);
      }
      mark.removeAttribute('style');
      mark.querySelectorAll('*').forEach(el => {
        el.style.fontSize = '';
        el.style.fontWeight = '';
        el.style.lineHeight = '';
        if (!el.getAttribute('style')) el.removeAttribute('style');
      });
    }

    function doApplyHighlight() {
      closeAllPopups();
      saveUndoState();
      let range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;

      range = normalizeTableRange(range);
      sel.removeAllRanges();
      sel.addRange(range);
      lastEditorRange = range.cloneRange();

      // Check if selection covers multiple cells in a table
      const startCell = (range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement)?.closest('td, th');
      const endCell = (range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement)?.closest('td, th');
      if (startCell && endCell && startCell !== endCell) {
        const table = startCell.closest('table.stilo-table');
        if (table && table === endCell.closest('table.stilo-table')) {
          const allCells = Array.from(table.querySelectorAll('td, th'));
          const sIdx = allCells.indexOf(startCell);
          const eIdx = allCells.indexOf(endCell);
          if (sIdx !== -1 && eIdx !== -1) {
            const fromIdx = Math.min(sIdx, eIdx);
            const toIdx = Math.max(sIdx, eIdx);
            for (let i = fromIdx; i <= toIdx; i++) {
              highlightTableCell(allCells[i]);
            }
            notifyChange();
            return;
          }
        }
      }

      // 1. If cursor or selection is already inside a mark, toggle it off by unwrapping
      const existingMark = getClosestElement('mark');
      if (existingMark && editor.contains(existingMark)) {
        const parent = existingMark.parentNode;
        while (existingMark.firstChild) {
          parent.insertBefore(existingMark.firstChild, existingMark);
        }
        parent.removeChild(existingMark);
        parent.normalize();
        notifyChange();
        return;
      }

      function wrapRangeWithMark(targetRange) {
        // Safety check: NEVER wrap table structure elements
        const cloned = targetRange.cloneContents();
        if (cloned.querySelector('table, thead, tbody, tr, th, td, .stilo-table-wrapper')) {
          const cell = (targetRange.startContainer.nodeType === 1 ? targetRange.startContainer : targetRange.startContainer.parentElement)?.closest('td, th');
          if (cell) {
            highlightTableCell(cell);
            return cell.querySelector('mark.stilo-highlight');
          }
          return null;
        }

        const mark = document.createElement('mark');
        mark.className = 'stilo-highlight';
        try {
          targetRange.surroundContents(mark);
        } catch (_) {
          const frag = targetRange.extractContents();
          if (frag.querySelector('table, thead, tbody, tr, th, td, .stilo-table-wrapper')) {
            targetRange.insertNode(frag);
            return null;
          }
          mark.appendChild(frag);
          targetRange.insertNode(mark);
        }
        mark.removeAttribute('style');
        mark.querySelectorAll('*').forEach(el => {
          el.style.fontSize = '';
          el.style.fontWeight = '';
          el.style.lineHeight = '';
          if (!el.getAttribute('style')) el.removeAttribute('style');
        });
        return mark;
      }

      if (!range.collapsed) {
        // Text is selected: wrap with <mark class="stilo-highlight">
        const text = sel.toString();
        if (text) {
          const mark = wrapRangeWithMark(range);
          if (mark) {
            const newRange = document.createRange();
            newRange.selectNodeContents(mark);
            sel.removeAllRanges();
            sel.addRange(newRange);
            lastEditorRange = newRange.cloneRange();
            notifyChange();
          }
        }
      } else {
        // Collapsed cursor: expand to current word under cursor
        const node = range.startContainer;
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          const offset = range.startOffset;
          let start = offset;
          while (start > 0 && /\S/.test(text[start - 1])) start--;
          let end = offset;
          while (end < text.length && /\S/.test(text[end])) end++;

          if (end > start) {
            range.setStart(node, start);
            range.setEnd(node, end);
            const mark = wrapRangeWithMark(range);
            if (mark) {
              const newRange = document.createRange();
              newRange.setStartAfter(mark);
              newRange.collapse(true);
              sel.removeAllRanges();
              sel.addRange(newRange);
              lastEditorRange = newRange.cloneRange();
              notifyChange();
              return;
            }
          }
        }
        // If not on a word, insert empty mark and place cursor inside
        const mark = document.createElement('mark');
        mark.className = 'stilo-highlight';
        mark.innerHTML = '&#8203;';
        range.insertNode(mark);
        setCursorAtStart(mark);
        notifyChange();
      }
    }

    function doApplyInlineCode() {
      closeAllPopups();
      saveUndoState();
      let range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;

      range = normalizeTableRange(range);
      sel.removeAllRanges();
      sel.addRange(range);
      lastEditorRange = range.cloneRange();

      // 1. If cursor or selection is already inside an inline code element, unwrap it (toggle off)
      const existingCode = getClosestElement('code');
      if (existingCode && !existingCode.closest('pre.stilo-code-block') && editor.contains(existingCode)) {
        const parent = existingCode.parentNode;
        while (existingCode.firstChild) {
          parent.insertBefore(existingCode.firstChild, existingCode);
        }
        parent.removeChild(existingCode);
        parent.normalize();
        notifyChange();
        return;
      }

      function wrapRangeWithCode(targetRange) {
        const codeEl = document.createElement('code');
        codeEl.className = 'stilo-inline-code';
        try {
          targetRange.surroundContents(codeEl);
        } catch (_) {
          const frag = targetRange.extractContents();
          codeEl.appendChild(frag);
          targetRange.insertNode(codeEl);
        }
        return codeEl;
      }

      if (!range.collapsed) {
        const text = sel.toString();
        if (text) {
          const codeEl = wrapRangeWithCode(range);
          if (codeEl) {
            const newRange = document.createRange();
            newRange.selectNodeContents(codeEl);
            sel.removeAllRanges();
            sel.addRange(newRange);
            lastEditorRange = newRange.cloneRange();
            notifyChange();
          }
        }
      } else {
        // Collapsed cursor: expand to current word under cursor if on a word
        const node = range.startContainer;
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          const offset = range.startOffset;
          let start = offset;
          while (start > 0 && /\S/.test(text[start - 1])) start--;
          let end = offset;
          while (end < text.length && /\S/.test(text[end])) end++;

          if (end > start) {
            range.setStart(node, start);
            range.setEnd(node, end);
            const codeEl = wrapRangeWithCode(range);
            if (codeEl) {
              const newRange = document.createRange();
              newRange.setStartAfter(codeEl);
              newRange.collapse(true);
              sel.removeAllRanges();
              sel.addRange(newRange);
              lastEditorRange = newRange.cloneRange();
              notifyChange();
              return;
            }
          }
        }
        // If not on a word, insert empty placeholder inline code
        const codeEl = document.createElement('code');
        codeEl.className = 'stilo-inline-code';
        codeEl.textContent = 'code';
        range.insertNode(codeEl);
        const newRange = document.createRange();
        newRange.selectNodeContents(codeEl);
        sel.removeAllRanges();
        sel.addRange(newRange);
        lastEditorRange = newRange.cloneRange();
        notifyChange();
      }
    }

    function doClearFormatting() {
      closeAllPopups();
      saveUndoState();
      const range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;
      const formattingSelector = 'strong, b, em, i, u, ins, del, s, strike, mark, sub, sup, code, a, font, span[style], span.stilo-tag, span.stilo-footnote-ref';

      if (!range.collapsed) {
        // 1. Text is selected: clear character and inline formatting in selection
        try {
          document.execCommand('removeFormat', false, null);

          const container = range.commonAncestorContainer;
          const root = container.nodeType === Node.ELEMENT_NODE ? container : container.parentElement;
          if (root && editor.contains(root)) {
            const nodes = root.querySelectorAll(formattingSelector);
            for (const node of nodes) {
              if (sel.containsNode(node, true)) {
                const parent = node.parentNode;
                if (parent) {
                  while (node.firstChild) {
                    parent.insertBefore(node.firstChild, node);
                  }
                  parent.removeChild(node);
                }
              }
            }
            root.normalize();
          }
        } catch (e) {
          console.error('Error clearing selection format:', e);
        }
        notifyChange();
        return;
      }

      // 2. Cursor is blinking (no selection): clear formatting of the current line/block
      const block = getClosestBlockElement();
      if (block && editor.contains(block)) {
        let targetDiv = block;
        const tag = block.tagName;
        const isTask = block.classList.contains('stilo-task');

        if (tag === 'H1' || tag === 'H2' || tag === 'H3' || tag === 'H4' || tag === 'H5' || tag === 'H6' || tag === 'BLOCKQUOTE' || tag === 'PRE' || isTask) {
          let text = '';
          if (isTask) {
            const taskText = block.querySelector('.task-text');
            text = taskText ? taskText.textContent : block.textContent;
          } else {
            text = block.textContent;
          }
          targetDiv = document.createElement('div');
          targetDiv.textContent = text || '';
          if (!targetDiv.textContent) targetDiv.innerHTML = '<br>';
          block.parentNode.replaceChild(targetDiv, block);
        } else {
          // Normal block (div, p, li, td, th)
          const nodes = block.querySelectorAll(formattingSelector);
          for (const node of nodes) {
            const parent = node.parentNode;
            if (parent) {
              while (node.firstChild) {
                parent.insertBefore(node.firstChild, node);
              }
              parent.removeChild(node);
            }
          }
          block.removeAttribute('style');
          if (!block.matches('td, th, li')) {
            block.className = '';
          }
          block.normalize();
          targetDiv = block;
        }

        setCursorAtEnd(targetDiv);
        notifyChange();
      }
    }

    function insertTodoItem() {
      closeAllPopups();
      saveUndoState();
      const range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;

      const block = getClosestBlockElement();
      if (block && (['TD', 'TH'].includes(block.tagName) || block.closest('table'))) {
        return;
      }

      const text = range.collapsed ? '' : sel.toString().trim();
      const isBlockEmpty = block && (!block.textContent.trim() || block.innerHTML === '<br>');

      if (range.collapsed && block && block !== editor && !block.closest('.stilo-task') && !['H1', 'TABLE'].includes(block.tagName) && !isBlockEmpty) {
        // Convert existing line into a checklist task
        const existingHtml = block.innerHTML;
        const task = document.createElement('div');
        task.className = 'stilo-task';
        task.innerHTML = `<input type="checkbox" class="stilo-checkbox"><span class="task-text">${existingHtml || '<br>'}</span>`;
        block.parentNode.replaceChild(task, block);
        const span = task.querySelector('.task-text');
        setCursorAtEnd(span);
        notifyChange();
        return;
      }

      const task = document.createElement('div');
      task.className = 'stilo-task';
      task.innerHTML = `<input type="checkbox" class="stilo-checkbox"><span class="task-text">${text ? escapeHtml(text) : '<br>'}</span>`;

      if (isBlockEmpty && block && block !== editor) {
        block.parentNode.replaceChild(task, block);
      } else {
        range.deleteContents();
        range.insertNode(task);
      }

      const span = task.querySelector('.task-text');
      if (text) {
        setCursorAtEnd(span);
      } else {
        setCursorAtStart(span);
      }
      notifyChange();
    }


    function insertHtmlSafely(htmlString) {
      const range = restoreSelectionIfNeeded();
      const sel = window.getSelection();


      if (range) {
        range.deleteContents();
        const temp = document.createElement('div');
        temp.innerHTML = htmlString;
        const frag = document.createDocumentFragment();
        let lastNode = null;
        while (temp.firstChild) {
          lastNode = frag.appendChild(temp.firstChild);
        }
        range.insertNode(frag);
        if (lastNode) {
          const newRange = document.createRange();
          newRange.setStartAfter(lastNode);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
          lastEditorRange = newRange;
        }
      } else {
        const temp = document.createElement('div');
        temp.innerHTML = htmlString;
        while (temp.firstChild) {
          editor.appendChild(temp.firstChild);
        }
      }
    }

    function insertTable(rows = 3, cols = 3) {
      doInsertCustomTable(rows, cols, true);
    }

    function doInsertCustomTable(rows = 3, cols = 3, hasHeader = true) {
      closeAllPopups();
      let tableHtml = '<div class="stilo-table-wrapper" contenteditable="false"><table class="stilo-table" contenteditable="true">';
      if (hasHeader) {
        tableHtml += '<thead><tr>';
        for (let c = 0; c < cols; c++) {
          tableHtml += `<th>Header ${c + 1}</th>`;
        }
        tableHtml += '</tr></thead><tbody>';
        const bodyRows = Math.max(1, rows - 1);
        for (let r = 0; r < bodyRows; r++) {
          tableHtml += '<tr>';
          for (let c = 0; c < cols; c++) {
            tableHtml += '<td>Cell</td>';
          }
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody>';
      } else {
        tableHtml += '<tbody>';
        for (let r = 0; r < rows; r++) {
          tableHtml += '<tr>';
          for (let c = 0; c < cols; c++) {
            tableHtml += '<td>Cell</td>';
          }
          tableHtml += '</tr>';
        }
        tableHtml += '</tbody>';
      }
      tableHtml += '</table><div class="table-handle" contenteditable="false" draggable="false" title="Drag to resize table"></div></div><div><br></div>';

      insertHtmlSafely(tableHtml);
      initAllHandles();
      const tables = editor.querySelectorAll('table.stilo-table');
      if (tables.length) {
        const newestTable = tables[tables.length - 1];
        lastActiveTable = newestTable;
        lastActiveCell = newestTable.querySelector('td, th');
        if (lastActiveCell) setCursorAtStart(lastActiveCell);
      }
      notifyChange();
    }

    function getActiveTableAndCell() {
      let table = lastActiveTable;
      let cell = lastActiveCell;

      if (table && !document.contains(table)) {
        table = null;
        lastActiveTable = null;
      }
      if (cell && !document.contains(cell)) {
        cell = null;
        lastActiveCell = null;
      }

      if (!table) {
        const sel = window.getSelection();
        if (sel && sel.rangeCount) {
          let node = sel.getRangeAt(0).commonAncestorContainer;
          if (node.nodeType === 3) node = node.parentNode;
          table = node ? node.closest('table.stilo-table') : null;
          cell = node ? node.closest('td, th') : null;
        }
      }

      if (!table) {
        table = editor.querySelector('table.stilo-table');
        if (table) {
          cell = table.querySelector('tbody td') || table.querySelector('td, th');
        }
      }

      return { cell, table };
    }

    function doAddTableRow() {
      const { cell, table } = getActiveTableAndCell();
      if (!table) {
        doInsertCustomTable(3, 3, true);
        return;
      }
      const firstRow = table.querySelector('tr');
      const colCount = firstRow ? firstRow.querySelectorAll('th, td').length : 3;
      const newRow = document.createElement('tr');
      for (let i = 0; i < colCount; i++) {
        const td = document.createElement('td');
        td.innerHTML = '<br>';
        newRow.appendChild(td);
      }

      let tbody = table.querySelector('tbody');
      if (!tbody) {
        tbody = document.createElement('tbody');
        table.appendChild(tbody);
      }

      if (cell && cell.closest('tbody')) {
        cell.closest('tr').insertAdjacentElement('afterend', newRow);
      } else if (cell && cell.closest('thead')) {
        tbody.insertAdjacentElement('afterbegin', newRow);
      } else {
        tbody.appendChild(newRow);
      }

      lastActiveTable = table;
      lastActiveCell = newRow.firstElementChild;
      initTableHandles(table);
      setCursorAtStart(newRow.firstElementChild);
      notifyChange();
    }

    function doAddTableColumn() {
      const { cell, table } = getActiveTableAndCell();
      if (!table) return;
      const colIdx = cell ? Array.from(cell.parentElement.children).indexOf(cell) : -1;
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        const isHeader = (row.parentElement && row.parentElement.tagName === 'THEAD') || (row === rows[0] && row.querySelector('th'));
        const newCell = document.createElement(isHeader ? 'th' : 'td');
        newCell.innerHTML = isHeader ? 'Header' : '<br>';
        if (colIdx >= 0 && colIdx < row.children.length) {
          row.children[colIdx].insertAdjacentElement('afterend', newCell);
        } else {
          row.appendChild(newCell);
        }
      });
      lastActiveTable = table;
      initTableHandles(table);
      notifyChange();
    }

    function doDeleteTableRow() {
      const { cell, table } = getActiveTableAndCell();
      if (!table) return;
      const allRows = Array.from(table.querySelectorAll('tr'));
      if (allRows.length <= 1) {
        doDeleteActiveTable();
        return;
      }
      let row = cell ? cell.closest('tr') : null;
      if (!row || (row.parentElement && row.parentElement.tagName === 'THEAD')) {
        const bodyRows = table.querySelectorAll('tbody tr');
        row = bodyRows.length ? bodyRows[bodyRows.length - 1] : allRows[allRows.length - 1];
      }
      if (!row) return;

      const nextCell = row.nextElementSibling ? row.nextElementSibling.querySelector('td, th') :
                       row.previousElementSibling ? row.previousElementSibling.querySelector('td, th') : null;
      row.remove();
      lastActiveCell = nextCell || table.querySelector('td, th');
      initTableHandles(table);
      notifyChange();
    }

    function doDeleteTableColumn() {
      const { cell, table } = getActiveTableAndCell();
      if (!table) return;
      const firstRow = table.querySelector('tr');
      if (!firstRow) return;
      const colCount = firstRow.querySelectorAll('th, td').length;
      if (colCount <= 1) {
        doDeleteActiveTable();
        return;
      }
      const colIdx = cell ? Array.from(cell.parentElement.children).indexOf(cell) : colCount - 1;
      const targetIdx = (colIdx >= 0 && colIdx < colCount) ? colIdx : colCount - 1;

      table.querySelectorAll('tr').forEach(row => {
        const cells = Array.from(row.children);
        if (cells[targetIdx]) {
          cells[targetIdx].remove();
        }
      });

      lastActiveCell = table.querySelector('td, th');
      initTableHandles(table);
      notifyChange();
    }

    function doDeleteActiveTable() {
      const { table } = getActiveTableAndCell();
      if (table) {
        const wrapper = table.closest('.stilo-table-wrapper');
        if (wrapper) {
          wrapper.remove();
        } else {
          table.remove();
        }
        lastActiveTable = null;
        lastActiveCell = null;
        notifyChange();
      }
    }

    function insertCodeBlock() {
      closeAllPopups();
      saveUndoState();
      const range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;

      let text = '';
      if (!range.collapsed) {
        text = sel.toString();
      }
      const placeholder = text ? escapeHtml(text) : '// Code here...';

      const block = getClosestBlockElement();
      if (block && (['TD', 'TH'].includes(block.tagName) || block.closest('table'))) {
        document.execCommand('insertHTML', false, `<code>${placeholder}</code>`);
        notifyChange();
        return;
      }

      const isBlockEmpty = block && (!block.textContent.trim() || block.innerHTML === '<br>');

      const pre = document.createElement('pre');
      pre.className = 'stilo-code-block';
      const code = document.createElement('code');
      code.innerHTML = placeholder;
      pre.appendChild(code);

      if (isBlockEmpty && block && block !== editor) {
        block.parentNode.replaceChild(pre, block);
      } else {
        range.deleteContents();
        range.insertNode(pre);
      }

      let nextDiv = pre.nextElementSibling;
      if (!nextDiv) {
        nextDiv = document.createElement('div');
        nextDiv.innerHTML = '<br>';
        pre.parentNode.insertBefore(nextDiv, pre.nextSibling);
      }

      // Select the code text inside so the user can immediately type over it
      const codeRange = document.createRange();
      codeRange.selectNodeContents(code);
      sel.removeAllRanges();
      sel.addRange(codeRange);

      notifyChange();
    }

    function insertQuote() {
      closeAllPopups();
      saveUndoState();
      const range = restoreSelectionIfNeeded();
      const sel = window.getSelection();
      if (!sel || !range) return;

      const block = getClosestBlockElement();
      if (block && (['TD', 'TH'].includes(block.tagName) || block.closest('table'))) {
        return;
      }

      const text = range.collapsed ? '' : sel.toString().trim();
      const placeholder = text ? escapeHtml(text) : 'Quote text...';

      const isBlockEmpty = block && (!block.textContent.trim() || block.innerHTML === '<br>');

      const quote = document.createElement('blockquote');
      quote.className = 'stilo-quote';
      const div = document.createElement('div');
      div.innerHTML = placeholder;
      quote.appendChild(div);

      if (isBlockEmpty && block && block !== editor) {
        block.parentNode.replaceChild(quote, block);
      } else {
        range.deleteContents();
        range.insertNode(quote);
      }

      let quoteNext = quote.nextElementSibling;
      if (!quoteNext) {
        quoteNext = document.createElement('div');
        quoteNext.innerHTML = '<br>';
        quote.parentNode.insertBefore(quoteNext, quote.nextSibling);
      }

      // Select the text inside the quote so the user can immediately type over it
      const quoteRange = document.createRange();
      quoteRange.selectNodeContents(div);
      sel.removeAllRanges();
      sel.addRange(quoteRange);

      notifyChange();
    }

    function insertDivider() {
      closeAllPopups();
      saveUndoState();
      const range = restoreSelectionIfNeeded();

      const cell = getClosestElement('td, th');
      if (cell) {
        return;
      }

      let block = getClosestBlockElement();

      if (range && !range.collapsed) {
        range.deleteContents();
        block = getClosestBlockElement();
      }

      const hr = document.createElement('hr');
      hr.className = 'stilo-hr';
      const nextDiv = document.createElement('div');
      nextDiv.innerHTML = '<br>';

      if (!block || block === editor) {
        editor.appendChild(hr);
        editor.appendChild(nextDiv);
        setCursorAtStart(nextDiv);
        notifyChange();
        return;
      }

      const list = block.closest('ul, ol');
      if (list) {
        if (!block.textContent.trim()) {
          block.remove();
          if (!list.firstElementChild) {
            list.parentNode.replaceChild(hr, list);
            hr.parentNode.insertBefore(nextDiv, hr.nextSibling);
            setCursorAtStart(nextDiv);
            notifyChange();
            return;
          }
        }
        list.parentNode.insertBefore(hr, list.nextSibling);
        hr.parentNode.insertBefore(nextDiv, hr.nextSibling);
        setCursorAtStart(nextDiv);
        notifyChange();
        return;
      }

      const isBlockEmpty = !block.textContent.trim() || block.innerHTML.trim() === '<br>';
      const isFirstH1 = (block.tagName === 'H1' && block === editor.firstElementChild);

      if (isBlockEmpty && !isFirstH1 && block.parentNode) {
        block.parentNode.replaceChild(hr, block);
        hr.parentNode.insertBefore(nextDiv, hr.nextSibling);
      } else {
        if (range && block.contains(range.startContainer)) {
          const tailRange = document.createRange();
          tailRange.setStart(range.startContainer, range.startOffset);
          tailRange.setEndAfter(block.lastChild || block);
          const frag = tailRange.extractContents();
          if (frag.textContent.trim() || frag.querySelector('img, table, br, code')) {
            nextDiv.innerHTML = '';
            nextDiv.appendChild(frag);
          }
        }
        block.parentNode.insertBefore(hr, block.nextSibling);
        hr.parentNode.insertBefore(nextDiv, hr.nextSibling);
      }

      setCursorAtStart(nextDiv);
      notifyChange();
    }

    let savedLinkRange = null;
    let savedLinkElement = null;

    function promptLink() {
      closeAllPopups();
      const sel = window.getSelection();
      let selectedText = '';
      let url = 'https://';
      let isEdit = false;

      if (sel && sel.rangeCount > 0) {
        savedLinkRange = sel.getRangeAt(0).cloneRange();
        selectedText = sel.toString().trim();
      } else {
        savedLinkRange = null;
      }

      // If cursor is on an internal wiki link, route to internal link dialog
      const existingWikiLink = getClosestElement('.stilo-wiki-link');
      if (existingWikiLink) {
        promptInternalLink();
        return;
      }

      // Check if cursor or selection is on an existing external link
      const existingLink = getClosestElement('a.stilo-link') || getClosestElement('a:not(.stilo-wiki-link)');
      if (existingLink) {
        isEdit = true;
        savedLinkElement = existingLink;
        if (!selectedText) {
          selectedText = existingLink.textContent ? existingLink.textContent.trim() : '';
        }
        const existingHref = existingLink.getAttribute('href');
        if (existingHref) {
          url = existingHref;
        }
      } else {
        savedLinkElement = null;
        if (selectedText.startsWith('http://') || selectedText.startsWith('https://') || selectedText.startsWith('www.')) {
          url = selectedText;
          selectedText = '';
        }
      }

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.insertLink) {
        window.webkit.messageHandlers.insertLink.postMessage(JSON.stringify({
          text: selectedText,
          url: url,
          isEdit: isEdit
        }));
      } else {
        // Fallback for non-WebKit environments
        const fallbackUrl = prompt('Enter URL:', url);
        if (fallbackUrl) {
          applyInsertLink(selectedText || fallbackUrl, fallbackUrl);
        }
      }
    }

    function promptInternalLink() {
      closeAllPopups();
      const sel = window.getSelection();
      let selectedText = '';
      let noteTitle = '';
      let noteHeading = '';
      let isEdit = false;

      if (sel && sel.rangeCount > 0) {
        savedLinkRange = sel.getRangeAt(0).cloneRange();
        selectedText = sel.toString().trim();
      } else {
        savedLinkRange = null;
      }

      const existingWikiLink = getClosestElement('.stilo-wiki-link');
      if (existingWikiLink) {
        isEdit = true;
        savedLinkElement = existingWikiLink;
        noteTitle = existingWikiLink.getAttribute('data-note-title') || '';
        noteHeading = existingWikiLink.getAttribute('data-note-heading') || '';
        const rawText = existingWikiLink.textContent ? existingWikiLink.textContent.trim() : '';
        const baseTarget = noteTitle + (noteHeading ? '/' + noteHeading : '');
        selectedText = (rawText === baseTarget || rawText === '[[' + baseTarget + ']]') ? '' : rawText;
      } else {
        savedLinkElement = null;
        if (selectedText.startsWith('[[') && selectedText.endsWith(']]')) {
          let inner = selectedText.slice(2, -2).trim();
          if (inner.includes('|')) {
            const parts = inner.split('|');
            inner = parts[0].trim();
            selectedText = parts.slice(1).join('|').trim();
          } else {
            selectedText = '';
          }
          if (inner.includes('/')) {
            const parts = inner.split('/');
            noteTitle = parts[0].trim();
            noteHeading = parts.slice(1).join('/').trim();
          } else {
            noteTitle = inner;
          }
        }
      }

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.insertInternalLink) {
        window.webkit.messageHandlers.insertInternalLink.postMessage(JSON.stringify({
          text: selectedText,
          noteTitle: noteTitle,
          noteHeading: noteHeading,
          isEdit: isEdit
        }));
      }
    }

    window.applyInsertLink = function(label, url) {
      if (!url) return;
      label = label || url;

      // Normalize URL if missing scheme
      if (!url.match(/^[a-zA-Z][a-zA-Z0-9+.-]*:/) && !url.startsWith('#')) {
        url = 'https://' + url;
      }

      const sel = window.getSelection();
      if (savedLinkRange) {
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);
      }

      const existingLink = savedLinkElement || getClosestElement('a.stilo-link') || getClosestElement('a:not(.stilo-wiki-link)');
      if (existingLink) {
        saveUndoState();
        existingLink.className = 'stilo-link';
        existingLink.setAttribute('href', url);
        existingLink.setAttribute('title', url);
        existingLink.setAttribute('target', '_blank');
        existingLink.removeAttribute('data-note-title');
        existingLink.removeAttribute('data-note-heading');
        existingLink.textContent = label;
        savedLinkRange = null;
        savedLinkElement = null;
        notifyChange();
        return;
      }

      saveUndoState();
      const linkHtml = `<a href="${escapeHtml(url)}" class="stilo-link" target="_blank" title="${escapeHtml(url)}">${escapeHtml(label)}</a>`;
      document.execCommand('insertHTML', false, linkHtml);
      savedLinkRange = null;
      savedLinkElement = null;
      notifyChange();
    };

    window.applyInsertInternalLink = function(data) {
      if (!data) return;
      let noteTitle = (data.noteTitle || '').trim();
      let noteHeading = (data.noteHeading || '').trim();
      let label = (data.label || '').trim();

      if (!noteTitle && !noteHeading) {
        savedLinkRange = null;
        savedLinkElement = null;
        return;
      }

      const safeTitle = encodeURIComponent(noteTitle);
      const safeHeading = noteHeading ? encodeURIComponent(noteHeading) : '';
      const href = 'teddy-note://' + safeTitle + (noteHeading ? '#' + safeHeading : '');
      const defaultDisplay = noteHeading ? (noteTitle + '/' + noteHeading) : noteTitle;
      const display = label || defaultDisplay;

      const sel = window.getSelection();
      if (savedLinkRange) {
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);
      }

      const existingLink = savedLinkElement || getClosestElement('.stilo-wiki-link');
      if (existingLink) {
        saveUndoState();
        existingLink.className = 'stilo-wiki-link';
        existingLink.setAttribute('href', href);
        existingLink.setAttribute('data-note-title', noteTitle);
        if (noteHeading) {
          existingLink.setAttribute('data-note-heading', noteHeading);
        } else {
          existingLink.removeAttribute('data-note-heading');
        }
        existingLink.removeAttribute('target');
        existingLink.removeAttribute('title');
        existingLink.textContent = display;
        savedLinkRange = null;
        savedLinkElement = null;
        notifyChange();
        return;
      }

      saveUndoState();
      const headingAttr = noteHeading ? ` data-note-heading="${escapeHtml(noteHeading)}"` : '';
      const linkHtml = `<a href="${href}" class="stilo-wiki-link" data-note-title="${escapeHtml(noteTitle)}"${headingAttr}>${escapeHtml(display)}</a>`;
      document.execCommand('insertHTML', false, linkHtml);
      savedLinkRange = null;
      savedLinkElement = null;
      notifyChange();
    };

    window.removeInsertLink = function() {
      const sel = window.getSelection();
      if (savedLinkRange) {
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);
      }
      const existingLink = savedLinkElement || getClosestElement('.stilo-wiki-link') || getClosestElement('a.stilo-link') || getClosestElement('a');
      if (existingLink) {
        saveUndoState();
        const parent = existingLink.parentNode;
        while (existingLink.firstChild) {
          parent.insertBefore(existingLink.firstChild, existingLink);
        }
        parent.removeChild(existingLink);
        savedLinkRange = null;
        savedLinkElement = null;
        notifyChange();
      }
      editor.focus();
    };

      const sel = window.getSelection();
      if (savedLinkRange) {
        sel.removeAllRanges();
        sel.addRange(savedLinkRange);

      savedLinkElement = null;
      editor.focus();
    };

    function navigateTableCell(cell, reverse) {
      const row = cell.parentElement;
      const table = row.closest('table');
      const allCells = Array.from(table.querySelectorAll('th, td'));
      const idx = allCells.indexOf(cell);

      if (reverse && idx > 0) {
        setCursorAtEnd(allCells[idx - 1]);
      } else if (!reverse && idx < allCells.length - 1) {
        setCursorAtEnd(allCells[idx + 1]);
      } else if (!reverse && idx === allCells.length - 1) {
        const colCount = row.children.length;
        const newRow = document.createElement('tr');
        for (let i = 0; i < colCount; i++) {
          const td = document.createElement('td');
          td.innerHTML = '<br>';
          newRow.appendChild(td);
        }
        table.querySelector('tbody').appendChild(newRow);
        setCursorAtStart(newRow.firstElementChild);
        notifyChange();
      }
    }

    function sanitizeHtml(html) {
      if (!html) return '';
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      // Strip dangerous tags
      const dangerousTags = ['script', 'iframe', 'object', 'embed', 'form', 'base', 'meta', 'link', 'style', 'applet'];
      dangerousTags.forEach(tag => {
        doc.body.querySelectorAll(tag).forEach(el => el.remove());
      });

      // Strip dangerous attributes and javascript:/vbscript: URLs
      const allEls = doc.body.querySelectorAll('*');
      allEls.forEach(el => {
        for (let attr of Array.from(el.attributes)) {
          const attrName = attr.name.toLowerCase();
          if (attrName.startsWith('on')) {
            el.removeAttribute(attr.name);
          }
        }
        ['href', 'src', 'action'].forEach(attrName => {
          const val = el.getAttribute(attrName);
          if (val) {
            const trimmed = val.trim().toLowerCase();
            if (trimmed.startsWith('javascript:') || trimmed.startsWith('vbscript:')) {
              el.removeAttribute(attrName);
            }
          }
        });
      });

      return doc.body.innerHTML;
    }

    function handleImageUpload(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const dataUrl = event.target.result;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.uploadImage) {
          const payload = {
            filename: file.name || 'image.png',
            mimeType: file.type || 'image/png',
            dataUrl: dataUrl
          };
          window.webkit.messageHandlers.uploadImage.postMessage(JSON.stringify(payload));
        } else {
          insertImageAtCursor(dataUrl, file.name || 'image');
        }
      };
      reader.readAsDataURL(file);
    }

    function onPaste(e) {
      const clipboardData = e.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      // 1. Check for image files in clipboard
      const items = clipboardData.items;
      if (items) {
        for (let item of items) {
          if (item.type && item.type.indexOf('image') === 0) {
            e.preventDefault();
            const file = item.getAsFile();
            if (file) {
              handleImageUpload(file);
            }
            return;
          }
        }
      }

      // Check if cursor is inside a code block: paste verbatim plain text
      const insidePre = getClosestElement('pre.stilo-code-block');
      if (insidePre) {
        const text = clipboardData.getData('text/plain');
        if (text) {
          e.preventDefault();
          saveUndoState();
          document.execCommand('insertText', false, text);
          notifyChange();
        }
        return;
      }

      // 2. Check for markdown syntax in plain text
      const text = clipboardData.getData('text/plain');
      if (text && hasMarkdownSyntax(text)) {
        const isBlockMarkdown = text.includes('\n') || /^(?:```|~~~|#{1,6}\s|>|[-*+]\s|\d+\.\s|[-*+]\s*\[[ xX]\]|\|)/m.test(text.trim());
        if (isBlockMarkdown) {
          e.preventDefault();
          saveUndoState();
          const parsedHtml = parseMarkdownToHtml(text);
          insertHtmlSafely(parsedHtml);
          initAllHandles();
          notifyChange();
          return;
        } else {
          const res = formatMarkdownInText(text);
          if (res.matched) {
            e.preventDefault();
            saveUndoState();
            document.execCommand('insertHTML', false, res.html);
            notifyChange();
            return;
          }
        }
      }

      // 3. If HTML was copied, sanitize it before inserting
      const html = clipboardData.getData('text/html');
      if (html) {
        e.preventDefault();
        saveUndoState();
        const clean = sanitizeHtml(html);
        document.execCommand('insertHTML', false, clean);
        notifyChange();
        return;
      }
    }

    function onDrop(e) {
      const files = e.dataTransfer ? e.dataTransfer.files : [];
      if (files && files.length > 0 && files[0].type.startsWith('image/')) {
        e.preventDefault();
        handleImageUpload(files[0]);
      }
    }

    function toggleHeadingMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('menu-heading');
      const isShown = menu.classList.contains('show');
      closeAllPopups();
      if (!isShown) menu.classList.add('show');
    }

    function toggleListMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('menu-list');
      const isShown = menu.classList.contains('show');
      closeAllPopups();
      if (!isShown) menu.classList.add('show');
    }

    function toggleMoreMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('menu-more');
      const isShown = menu.classList.contains('show');
      closeAllPopups();
      if (!isShown) menu.classList.add('show');
    }

    function closeAllPopups() {
      document.querySelectorAll('.tb-popup').forEach(p => p.classList.remove('show'));
    }

    function getClosestElement(selector) {
      const sel = window.getSelection();
      if (!sel.rangeCount) return null;
      let node = sel.getRangeAt(0).commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentNode;
      return node.closest(selector);
    }

    function getClosestBlockElement() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return null;
      let node = sel.getRangeAt(0).commonAncestorContainer;
      if (node === editor) return editor.firstElementChild || null;
      while (node && node !== editor) {
        if (node.nodeType === 1) {
          const tag = node.tagName.toLowerCase();
          if (['div', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'li', 'td', 'th'].includes(tag)) {
            return node;
          }
        }
        if (node.parentNode === editor) {
          if (node.nodeType === 3) {
            const div = document.createElement('div');
            node.parentNode.insertBefore(div, node);
            div.appendChild(node);
            return div;
          }
          return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    function setCursorAtStart(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el.focus();
    }

    function setCursorAtEnd(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el.focus();
    }

    function setCursorAfterElement(el, withSpace = false) {
      if (!el || !el.parentNode) return;
      const parent = el.parentNode;
      const next = el.nextSibling;

      if (withSpace) {
        if (next && next.nodeType === Node.TEXT_NODE) {
          next.textContent = ' ' + next.textContent.replace(/^\u200B/, '');
          const range = document.createRange();
          range.setStart(next, 1);
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          const spaceNode = document.createTextNode('\u00A0');
          parent.insertBefore(spaceNode, next);
          const range = document.createRange();
          range.setStart(spaceNode, 1);
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        return;
      }

      if (next && next.nodeType === Node.TEXT_NODE && next.textContent.length > 0) {
        const range = document.createRange();
        range.setStart(next, 0);
        range.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        const zwsp = document.createTextNode('\u200B');
        parent.insertBefore(zwsp, next);
        const range = document.createRange();
        range.setStart(zwsp, 1);
        range.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function setCursorBeforeElement(el, withSpace = false) {
      if (!el || !el.parentNode) return;
      const parent = el.parentNode;
      const prev = el.previousSibling;

      if (withSpace) {
        if (prev && prev.nodeType === Node.TEXT_NODE) {
          prev.textContent = prev.textContent.replace(/\u200B$/, '') + ' ';
          const range = document.createRange();
          range.setStart(prev, prev.textContent.length);
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          const spaceNode = document.createTextNode('\u00A0');
          parent.insertBefore(spaceNode, el);
          const range = document.createRange();
          range.setStart(spaceNode, 1);
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        return;
      }

      if (prev && prev.nodeType === Node.TEXT_NODE && prev.textContent.length > 0) {
        const range = document.createRange();
        range.setStart(prev, prev.textContent.length);
        range.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        const zwsp = document.createTextNode('\u200B');
        parent.insertBefore(zwsp, el);
        const range = document.createRange();
        range.setStart(zwsp, 0);
        range.collapse(true);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    function flattenNestedBadges(container) {
      const root = container || editor;
      if (!root) return;
      let nested = root.querySelectorAll('.stilo-tag .stilo-tag, .stilo-tag .stilo-mention, .stilo-tag .stilo-category-badge, .stilo-mention .stilo-tag, .stilo-category-badge .stilo-tag');
      let safetyLimit = 10;
      while (nested.length > 0 && safetyLimit-- > 0) {
        nested.forEach(badge => {
          const outer = badge.parentElement ? badge.parentElement.closest('.stilo-tag, .stilo-mention, .stilo-category-badge') : null;
          if (outer && outer !== badge) {
            if (outer.textContent.trim() === badge.textContent.trim()) {
              outer.replaceWith(badge);
            } else {
              const tn = document.createTextNode(badge.textContent);
              badge.replaceWith(tn);
            }
          }
        });
        nested = root.querySelectorAll('.stilo-tag .stilo-tag, .stilo-tag .stilo-mention, .stilo-tag .stilo-category-badge, .stilo-mention .stilo-tag, .stilo-category-badge .stilo-tag');
      }
    }

    function syncAndCleanTags(container) {
      const root = container || editor;
      if (!root) return;
      const tags = root.querySelectorAll('.stilo-tag');
      tags.forEach(tag => {
        const text = tag.textContent;
        const trimmed = text.trim();
        if (!trimmed) {
          tag.remove();
          return;
        }
        if (!trimmed.startsWith('#')) {
          const sel = window.getSelection();
          let savedOffset = -1;
          if (sel && sel.rangeCount && tag.contains(sel.getRangeAt(0).startContainer)) {
            const range = sel.getRangeAt(0);
            const preRange = range.cloneRange();
            preRange.selectNodeContents(tag);
            preRange.setEnd(range.startContainer, range.startOffset);
            savedOffset = preRange.toString().length;
          }
          const tn = document.createTextNode(text);
          tag.parentNode.replaceChild(tn, tag);
          if (savedOffset >= 0 && sel) {
            const newRange = document.createRange();
            newRange.setStart(tn, Math.min(savedOffset, tn.textContent.length));
            newRange.collapse(true);
            sel.removeAllRanges();
            sel.addRange(newRange);
          }
          return;
        }
        if (/\s/.test(trimmed)) {
          const parts = trimmed.split(/\s+/);
          const firstTag = parts[0];
          const restIndex = text.indexOf(firstTag) + firstTag.length;
          const restText = text.substring(restIndex);
          tag.textContent = firstTag;
          const clean = firstTag.replace(/^#+/, '').trim().toLowerCase();
          tag.setAttribute('data-tag', clean);
          if (restText) {
            const tn = document.createTextNode(restText);
            tag.parentNode.insertBefore(tn, tag.nextSibling);
          }
          return;
        }
        const clean = trimmed.replace(/^#+/, '').trim().toLowerCase();
        if (clean && tag.getAttribute('data-tag') !== clean) {
          tag.setAttribute('data-tag', clean);
        }
      });
    }

    // ==========================================
    // Python WebKit Bridge & Data Extraction
    // ==========================================

    function getPlainLines(maxLines) {
      const text = (editor.textContent || '').replace(/\u200B/g, '');
      const lines = [];
      for (const line of text.split('\n')) {
        const t = line.trim();
        if (!t) continue;
        lines.push(t);
        if (lines.length >= maxLines) break;
      }
      return lines;
    }

    function getTitle() {
      const h1 = editor.querySelector('h1');
      if (h1) {
        const t = (h1.textContent || '').replace(/\u200B/g, '').trim();
        if (t) return t;
      }
      return getPlainLines(1)[0] || 'Untitled Note';
    }

    function getExcerpt() {
      const lines = getPlainLines(3);
      if (lines.length > 1) {
        return lines.slice(1, 3).join(' ');
      } else if (lines.length === 1) {
        return lines[0];
      }
      return '';
    }

    function getTags() {
      const tagEls = editor.querySelectorAll('.stilo-tag');
      const tags = new Set();
      tagEls.forEach(el => {
        const t = el.getAttribute('data-tag');
        if (t) tags.add(t.toLowerCase());
      });
      const text = (editor.textContent || '').replace(/\u200B/g, '');
      const rawMatches = text.match(/(?:^|[\s.,;:!?])#([a-zA-Z0-9_\-]+)(?=$|[\s.,;:!?])/g);
      if (rawMatches) {
        rawMatches.forEach(m => {
          const t = m.trim().replace(/^#/, '').toLowerCase();
          if (t) tags.add(t);
        });
      }
      return Array.from(tags);
    }

    function getStats() {
      const text = (editor.textContent || '').replace(/\u200B/g, '');
      const words = (text.match(/\S+/g) || []).length;
      const chars = text.length;
      const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0).length;
      const readMinutes = Math.max(1, Math.ceil(words / 200));
      return {
        words: words,
        chars: chars,
        paragraphs: paragraphs,
        readTime: readMinutes + ' min'
      };
    }

    function hasTodo() {
      if (editor.querySelector('.stilo-task, input[type="checkbox"]')) {
        return true;
      }
      const text = editor.textContent || '';
      return text.includes('[ ]') || text.includes('[x]') || text.includes('[X]');
    }

    function getCleanHtml() {
      const needsSanitize = editor.querySelector('.table-handle, .image-handle, .col-resize-handle, .table-active, .img-active, .stilo-table-wrapper');
      if (!needsSanitize) {
        return editor.innerHTML.replace(/\u200B/g, '');
      }
      const clone = editor.cloneNode(true);
      clone.querySelectorAll('.table-handle, .image-handle, .col-resize-handle').forEach(h => h.remove());
      clone.querySelectorAll('.table-active, .img-active').forEach(el => {
        el.classList.remove('table-active');
        el.classList.remove('img-active');
      });
      // Unwrap .stilo-table-wrapper to keep clean HTML markup while retaining width
      clone.querySelectorAll('.stilo-table-wrapper').forEach(wrapper => {
        const tbl = wrapper.querySelector('table.stilo-table');
        if (tbl) {
          if (wrapper.style.width && !tbl.style.width) {
            tbl.style.width = wrapper.style.width;
          }
          wrapper.parentNode.insertBefore(tbl, wrapper);
          wrapper.remove();
        }
      });
      if (clone.querySelector('.stilo-tag, .stilo-mention, .stilo-category-badge')) {
        flattenNestedBadges(clone);
        syncAndCleanTags(clone);
      }
      return clone.innerHTML.replace(/\u200B/g, '');
    }

    function notifyChangeDebounced() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(notifyChange, 300);
    }

    let isReadOnlyMode = false;

    function setReadOnly(readOnly) {
      isReadOnlyMode = Boolean(readOnly);
      if (isReadOnlyMode) {
        document.body.classList.add('read-only');
        editor.setAttribute('contenteditable', 'false');
      } else {
        document.body.classList.remove('read-only');
        editor.setAttribute('contenteditable', 'true');
      }
      editor.querySelectorAll('table.stilo-table').forEach(tbl => {
        tbl.setAttribute('contenteditable', isReadOnlyMode ? 'false' : 'true');
      });
      editor.querySelectorAll('.task-text').forEach(sp => {
        sp.setAttribute('contenteditable', isReadOnlyMode ? 'false' : 'true');
      });
      editor.querySelectorAll('.table-handle, .image-handle, .col-resize-handle').forEach(h => {
        h.style.display = isReadOnlyMode ? 'none' : '';
      });
      closeAllPopups();
    }

    function notifyChange() {
      if (isUpdatingFromPython || isReadOnlyMode) return;
      const currentHtml = getCleanHtml();
      const currentTitle = getTitle();
      if (currentHtml === lastSavedHtml && currentTitle === lastSavedTitle) {
        return;
      }
      lastSavedHtml = currentHtml;
      lastSavedTitle = currentTitle;

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.contentChanged) {
        const payload = {
          title: currentTitle,
          excerpt: getExcerpt(),
          html: currentHtml,
          tags: getTags(),
          stats: getStats(),
          has_todo: hasTodo()
        };
        window.webkit.messageHandlers.contentChanged.postMessage(JSON.stringify(payload));
      }
    }

    // Window methods called from Python
    window.setReadOnly = setReadOnly;
    window.scrollToHeading = scrollToHeading;

    window.setEditorContent = function(html, selectUntitled = false, readOnly = false) {
      userInteractedWithCurrentNote = false;
      isUpdatingFromPython = true;
      editor.innerHTML = html || '<h1>Untitled Note</h1><div><br></div>';
      flattenNestedBadges(editor);
      syncAndCleanTags(editor);
      initAllHandles();
      lastSavedHtml = getCleanHtml();
      lastSavedTitle = getTitle();
      isUpdatingFromPython = false;

      initUndoStack();

      setReadOnly(readOnly);

      const h1 = editor.querySelector('h1');
      const isUntitledText = h1 && isUntitledTitleText(h1.textContent);
      if (!readOnly && (selectUntitled || isUntitledText)) {
        selectUntitledTitle();
      }

      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.statsChanged) {
        window.webkit.messageHandlers.statsChanged.postMessage(JSON.stringify(getStats()));
      }
    };

    window.flushEditor = function() {
      notifyChange();
      return getCleanHtml();
    };

    window.getEditorContent = function() {
      return getCleanHtml();
    };

    window.setEditorTheme = function(isDark) {
      document.documentElement.className = isDark ? 'dark-theme' : 'light-theme';
    };

    window.setFontSize = function(sizePt) {
      document.documentElement.style.setProperty('--base-font-size', sizePt + 'pt');
    };

    window.setFontFamily = function(fontStack) {
      if (fontStack) document.documentElement.style.setProperty('--font-stack', fontStack);
    };

    window.setTypography = function(config) {
      if (!config) return;
      if (config.fontSize) document.documentElement.style.setProperty('--base-font-size', config.fontSize + 'pt');
      if (config.headingScale) document.documentElement.style.setProperty('--heading-scale', config.headingScale);
      if (config.codeFontSize) document.documentElement.style.setProperty('--code-font-size', config.codeFontSize + 'px');
      if (config.quoteFontSize) document.documentElement.style.setProperty('--quote-font-size', config.quoteFontSize + 'pt');
      if (config.fontFamily) document.documentElement.style.setProperty('--font-stack', config.fontFamily);
    };

    window.performUndo = performUndo;
    window.performRedo = performRedo;
    window.selectUntitledTitle = selectUntitledTitle;
    window.focusEditor = focusEditor;
    window.getStats = getStats;

    window.insertCustomTable = function(rows = 3, cols = 3, hasHeader = true) {
      saveUndoState();
      doInsertCustomTable(rows, cols, hasHeader);
    };
    window.addTableRow = function() {
      saveUndoState();
      doAddTableRow();
    };
    window.addTableColumn = function() {
      saveUndoState();
      doAddTableColumn();
    };
    window.deleteTableRow = function() {
      saveUndoState();
      doDeleteTableRow();
    };
    window.deleteTableColumn = function() {
      saveUndoState();
      doDeleteTableColumn();
    };
    window.deleteActiveTable = function() {
      saveUndoState();
      doDeleteActiveTable();
    };

    window.execFormatting = function(command, value = null) {
      if (command === 'undo') {
        performUndo();
        return;
      }
      if (command === 'redo') {
        performRedo();
        return;
      }
      saveUndoState();
      if (command === 'heading1') applyHeading('h1');
      else if (command === 'heading2') applyHeading('h2');
      else if (command === 'heading3') applyHeading('h3');
      else if (command === 'paragraph') applyHeading('p');
      else if (command === 'todo') insertTodoItem();
      else if (command === 'bullet') applyList('insertUnorderedList');
      else if (command === 'number') applyList('insertOrderedList');
      else if (command === 'bold') applyFormat('bold');
      else if (command === 'italic') applyFormat('italic');
      else if (command === 'underline') applyFormat('underline');
      else if (command === 'strike') applyFormat('strikeThrough');
      else if (command === 'highlight') doApplyHighlight();
      else if (command === 'inline-code' || command === 'inlineCode') doApplyInlineCode();
      else if (command === 'clear-format' || command === 'clearFormat' || command === 'removeFormat') doClearFormatting();
      else if (command === 'quote') insertQuote();
      else if (command === 'code' || command === 'codeBlock') insertCodeBlock();
      else if (command === 'table') doInsertCustomTable(3, 3, true);
      else if (command === 'table-add-row') doAddTableRow();
      else if (command === 'table-add-col') doAddTableColumn();
      else if (command === 'table-del-row') doDeleteTableRow();
      else if (command === 'table-del-col') doDeleteTableColumn();
      else if (command === 'table-delete') doDeleteActiveTable();
      else if (command === 'divider' || command === 'horizontal-rule' || command === 'hr') insertDivider();
      else if (command === 'link') promptLink();
      else if (command === 'wiki-link' || command === 'internal-link' || command === 'note-link') promptInternalLink();
      else if (command === 'image') triggerImagePicker();
    };

    window.clearFormatting = doClearFormatting;
    window.applyHighlight = doApplyHighlight;
    window.applyInlineCode = doApplyInlineCode;
    window.insertDivider = insertDivider;

    window.insertTag = function(tagName) {
      if (!tagName) return;
      const cleanTag = tagName.replace(/^#+/, '').trim().toLowerCase();
      if (!cleanTag) return;
      const existingBadge = getClosestElement('.stilo-tag, .stilo-mention, .stilo-category-badge');
      if (existingBadge) {
        setCursorAfterElement(existingBadge, false);
      }
      saveUndoState();
      const tagHtml = `<span class="stilo-tag" data-tag="${cleanTag}">#${cleanTag}</span>&nbsp;`;
      insertHtmlSafely(tagHtml);
      flattenNestedBadges(editor);
      notifyChange();
    };
  </script>
</body>
