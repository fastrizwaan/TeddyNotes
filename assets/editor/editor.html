<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teddy Notes Editor</title>
  <style>
    :root {
      --base-font-size: 16pt;
      --heading-scale: 1.0;
      --code-font-size: 14px;
      --quote-font-size: 16pt;
      --font-stack: -apple-system, BlinkMacSystemFont, "Cantarell", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", "Source Code Pro", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --transition-speed: 0s;
    }

    /* Light Theme (Adwaita Light) */
    html.light-theme {
      --bg-color: #FAFAFB;
      --editor-bg: #FFFFFF;
      --text-color: #1E1F24;
      --text-secondary: #646875;
      --heading-color: #121316;
      --border-color: #E2E4E9;
      --accent-color: #7B2CBF;
      --accent-hover: #651E9F;
      --accent-soft: rgba(123, 44, 191, 0.10);
      --code-bg: #F0F2F6;
      --code-border: #E0E2EA;
      --code-text: #B5179E;
      --quote-border: #7B2CBF;
      --quote-bg: #F7F5FC;
      --table-border: #E0E2E8;
      --table-header-bg: #F4F5F8;
      --task-completed: #8E929E;
      --tag-bg: #EDE7F6;
      --tag-text: #6A1B9A;
      --tag-hover: #D1C4E9;
      --highlight-bg: #FFF3C4;
      --hr-color: #E4E6EB;
      --link-color: #3584E4;
      --link-hover: #1C71D8;
      --toolbar-bg: rgba(255, 255, 255, 0.94);
      --toolbar-border: #DCDCDE;
      --toolbar-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      --toolbar-btn-hover: #ECEEF2;
      --toolbar-btn-active: #E0E3E8;
    }

    /* Dark Theme (Adwaita Dark) */
    html.dark-theme {
      --bg-color: #1E1E22;
      --editor-bg: #24252A;
      --text-color: #E8E9EC;
      --text-secondary: #9DA0A8;
      --heading-color: #FFFFFF;
      --border-color: #35363D;
      --accent-color: #C77DFF;
      --accent-hover: #DA9EFE;
      --accent-soft: rgba(199, 125, 255, 0.15);
      --code-bg: #1A1A1E;
      --code-border: #2F3038;
      --code-text: #FF758F;
      --quote-border: #C77DFF;
      --quote-bg: #2B2636;
      --table-border: #35373F;
      --table-header-bg: #2B2C33;
      --task-completed: #6E717B;
      --tag-bg: #3B2A54;
      --tag-text: #E0AAFF;
      --tag-hover: #4E3770;
      --highlight-bg: #594A1C;
      --hr-color: #35363D;
      --link-color: #78AEED;
      --link-hover: #99C1F1;
      --toolbar-bg: rgba(36, 37, 42, 0.94);
      --toolbar-border: #44464F;
      --toolbar-shadow: 0 4px 22px rgba(0, 0, 0, 0.35);
      --toolbar-btn-hover: #32333A;
      --toolbar-btn-active: #3C3E47;
    }

    /* Auto dark theme when system prefers dark and light-theme not forced */
    @media (prefers-color-scheme: dark) {
      html:not(.light-theme) {
        --bg-color: #1E1E22;
        --editor-bg: #24252A;
        --text-color: #E8E9EC;
        --text-secondary: #9DA0A8;
        --heading-color: #FFFFFF;
        --border-color: #35363D;
        --accent-color: #C77DFF;
        --accent-hover: #DA9EFE;
        --accent-soft: rgba(199, 125, 255, 0.15);
        --code-bg: #1A1A1E;
        --code-border: #2F3038;
        --code-text: #FF758F;
        --quote-border: #C77DFF;
        --quote-bg: #2B2636;
        --table-border: #35373F;
        --table-header-bg: #2B2C33;
        --task-completed: #6E717B;
        --tag-bg: #3B2A54;
        --tag-text: #E0AAFF;
        --tag-hover: #4E3770;
        --highlight-bg: #594A1C;
        --hr-color: #35363D;
        --link-color: #78AEED;
        --link-hover: #99C1F1;
        --toolbar-bg: rgba(36, 37, 42, 0.94);
        --toolbar-border: #44464F;
        --toolbar-shadow: 0 4px 22px rgba(0, 0, 0, 0.35);
        --toolbar-btn-hover: #32333A;
        --toolbar-btn-active: #3C3E47;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--editor-bg);
      color: var(--text-color);
      font-family: var(--font-stack);
      font-size: var(--base-font-size, 16pt);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-x: clip;
    }

    #editor-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 32px 140px 32px;
      min-height: 100%;
    }

    #editor {
      outline: none;
      min-height: 70vh;
      overflow-wrap: break-word;
      word-break: break-word;
      caret-color: var(--text-color);
    }

    #editor > *:first-child {
      margin-top: 0 !important;
      padding-top: 0;
    }

    /* Headings */
    h1, h2, h3, h4 {
      color: var(--heading-color);
      font-weight: 700;
      line-height: 1.25;
      margin-top: 0.35em;
      margin-bottom: 0.2em;
    }

    h1 {
      font-size: calc(2.15rem * var(--heading-scale, 1.0));
      letter-spacing: -0.02em;
      margin-top: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.35em;
    }

    h2 {
      font-size: calc(1.65rem * var(--heading-scale, 1.0));
      letter-spacing: -0.015em;
      margin-top: 0.35em;
      margin-bottom: 0.2em;
    }

    h3 {
      font-size: calc(1.32rem * var(--heading-scale, 1.0));
      margin-top: 0.3em;
      margin-bottom: 0.2em;
    }

    h4 {
      font-size: calc(1.12rem * var(--heading-scale, 1.0));
      margin-top: 0.25em;
      margin-bottom: 0.15em;
    }

    #editor p, #editor div {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
    }

    /* Checklists (Interactive Tasks) */
    .stilo-task {
      display: flex;
      align-items: flex-start;
      margin: 5px 0;
      line-height: 1.5;
    }

    .stilo-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 19px;
      height: 19px;
      margin: 3px 10px 0 0;
      border: 2px solid var(--border-color);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
      background-color: var(--editor-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .stilo-checkbox:hover {
      border-color: var(--accent-color);
      background-color: var(--accent-soft);
    }

    .stilo-checkbox:checked {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .stilo-checkbox:checked::after {
      content: "";
      width: 5px;
      height: 9px;
      border: solid #FFFFFF;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-0.5px, -0.5px);
      display: block;
    }

    .stilo-task.completed .task-text {
      text-decoration: line-through;
      color: var(--task-completed);
      transition: color 0.15s ease;
    }

    .task-text {
      flex: 1;
      outline: none;
    }

    /* Lists */
    ul.stilo-list, ol.stilo-numbered-list {
      padding-left: 26px;
      margin: 6px 0;
    }

    ul.stilo-list li, ol.stilo-numbered-list li {
      margin-bottom: 4px;
    }

    /* Horizontal Rule */
    hr.stilo-hr, hr {
      border: none;
      border-top: 1px solid var(--hr-color);
      margin: 18px 0;
    }

    /* Blockquotes */
    blockquote.stilo-quote {
      font-size: var(--quote-font-size, 16pt);
      margin: 14px 0;
      padding: 10px 18px;
      border-left: 4px solid var(--quote-border);
      background: var(--quote-bg);
      border-radius: 0 8px 8px 0;
      color: var(--text-color);
      font-style: italic;
    }

    /* Subscript and Superscript */
    sub {
      font-size: 75%;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
      bottom: -0.25em;
    }

    sup {
      font-size: 75%;
      line-height: 0;
      position: relative;
      vertical-align: baseline;
      top: -0.5em;
    }

    /* Headings 5 and 6 */
    h5 {
      font-size: 1.05em;
      font-weight: 600;
      margin-top: 0.25em;
      margin-bottom: 0.15em;
      color: var(--text-color);
    }

    h6 {
      font-size: 1.0em;
      font-weight: 600;
      margin-top: 0.2em;
      margin-bottom: 0.1em;
      color: var(--text-secondary, #666);
    }

    /* Definition Lists */
    dl.stilo-dl {
      margin: 14px 0;
    }

    dl.stilo-dl dt {
      font-weight: 600;
      margin-top: 10px;
    }

    dl.stilo-dl dd {
      margin-left: 24px;
      margin-bottom: 6px;
    }

    /* Footnotes */
    .stilo-footnotes {
      margin-top: 28px;
      font-size: 0.9em;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      opacity: 0.9;
    }

    .stilo-footnote-ref {
      font-size: 0.75em;
      vertical-align: super;
      font-weight: 600;
    }

    .stilo-footnote-backref {
      text-decoration: none;
      margin-left: 6px;
      color: var(--accent-color, #7B2CBF);
    }

    /* Code Blocks */
    pre.stilo-code-block {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: var(--code-font-size, 14px);
      line-height: 1.5;
      overflow-x: auto;
      margin: 14px 0;
      position: relative;
    }

    code.stilo-inline-code {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      color: var(--code-text);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: calc(var(--code-font-size, 14px) * 0.95);
    }

    mark.stilo-highlight, .stilo-highlight {
      background-color: rgba(255, 230, 0, 0.45);
      color: inherit;
      font-size: inherit;
      font-family: inherit;
      font-weight: inherit;
      line-height: inherit;
      padding: 1px 4px;
      border-radius: 3px;
    }

    body.dark mark.stilo-highlight, body.dark .stilo-highlight {
      background-color: rgba(255, 215, 0, 0.35);
      color: inherit;
    }

    /* Ensure highlights inside headings retain the heading typography */
    h1 mark, h2 mark, h3 mark, h4 mark, h5 mark, h6 mark,
    h1 .stilo-highlight, h2 .stilo-highlight, h3 .stilo-highlight, h4 .stilo-highlight, h5 .stilo-highlight, h6 .stilo-highlight,
    h1 mark *, h2 mark *, h3 mark *, h4 mark *, h5 mark *, h6 mark * {
      font-size: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }

    /* Tables */
    .stilo-table-wrapper {
      position: relative;
      display: block;
      margin: 16px 0;
      max-width: 100%;
      width: fit-content;
      box-sizing: border-box;
    }

    .stilo-table-wrapper.table-active {
      outline: 2px solid var(--accent-color, #7B2CBF);
      border-radius: 8px;
    }

    table.stilo-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0;
      border: 1px solid var(--table-border);
      border-radius: 8px;
      box-sizing: border-box;
    }

    table.stilo-table th, table.stilo-table td {
      border: 1px solid var(--table-border);
      padding: 8px 14px;
      text-align: left;
      position: relative;
      min-width: 40px;
      box-sizing: border-box;
    }

    table.stilo-table th {
      background-color: var(--table-header-bg);
      font-weight: 600;
    }

    /* Images */
    .stilo-img-wrapper {
      margin: 16px 0;
      display: inline-block;
      max-width: 100%;
      position: relative;
      line-height: 0;
      box-sizing: border-box;
    }

    .stilo-img-wrapper.img-active {
      outline: 2px solid var(--accent-color, #7B2CBF);
      border-radius: 8px;
    }

    .stilo-img {
      max-width: 100%;
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: auto;
    }

    /* Interactive Resize Handles */
    .table-handle, .image-handle {
      position: absolute;
      bottom: -7px;
      right: -7px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      background: var(--accent-color, #7B2CBF);
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      z-index: 100;
      user-select: none;
      -webkit-user-select: none;
      display: none;
      pointer-events: auto;
    }

    .stilo-table-wrapper.table-active .table-handle,
    .stilo-img-wrapper.img-active .image-handle {
      display: block;
    }

    .col-resize-handle {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      -webkit-user-select: none;
      z-index: 50;
    }

    .col-resize-handle:hover {
      background-color: var(--accent-color, #7B2CBF);
      opacity: 0.7;
    }

    /* Symbol Mapping Badges: #tag, @mention, [[wiki-link]], ##category */
    .stilo-tag {
      display: inline-block;
      padding: 1px 7px;
      margin: 0 2px;
      border-radius: 6px;
      background: var(--tag-bg, #EDE7F6);
      color: var(--tag-text, #6A1B9A);
      font-size: 0.9em;
      font-weight: 500;
      cursor: text;
      user-select: text;
      transition: background 0.15s ease;
    }
    body.read-only .stilo-tag {
      cursor: pointer;
    }
    .stilo-tag:hover {
      background: var(--tag-hover, #D1C4E9);
    }

    .stilo-mention {
      display: inline-block;
      padding: 1px 7px;
      margin: 0 2px;
      border-radius: 6px;
      background: rgba(53, 132, 228, 0.12);
      color: #1c71d8;
      font-size: 0.9em;
      font-weight: 500;
      cursor: text;
      user-select: text;
      transition: background 0.15s ease;
    }
    body.read-only .stilo-mention {
      cursor: pointer;
    }
    html.dark-theme .stilo-mention {
      background: rgba(98, 160, 234, 0.2);
      color: #78aeed;
    }
    .stilo-mention:hover {
      background: rgba(53, 132, 228, 0.22);
    }

    /* Hyperlinks */
    a, a.stilo-link {
      color: var(--link-color, #3584E4);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color var(--transition-speed);
    }

    a:hover, a.stilo-link:hover {
      color: var(--link-hover, #1C71D8);
    }

    a:not(.stilo-wiki-link):visited {
      color: var(--link-color, #3584E4);
    }

    .stilo-wiki-link {
      color: var(--accent-color, #7B2CBF);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
      cursor: pointer;
      font-weight: 500;
      border-radius: 4px;
      padding: 0 2px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .stilo-wiki-link:hover {
      color: var(--accent-hover, #5A189A);
      background: var(--accent-soft);
    }

    .stilo-category-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      margin: 0 2px;
      border-radius: 6px;
      background: rgba(230, 97, 0, 0.12);
      color: #e66100;
      font-size: 0.9em;
      font-weight: 500;
      cursor: pointer;
      user-select: all;
      transition: background 0.15s ease;
    }
    html.dark-theme .stilo-category-badge {
      background: rgba(255, 163, 72, 0.18);
      color: #ffa348;
    }
    .stilo-category-badge:hover {
      background: rgba(230, 97, 0, 0.22);
    }

    /* Floating Autocomplete Popover */
    .stilo-autocomplete-popover {
      position: absolute;
      z-index: 10000;
      min-width: 220px;
      max-width: 340px;
      max-height: 250px;
      overflow-y: auto;
      background: var(--editor-bg, #ffffff);
      border: 1px solid var(--border-color, #E2E4E9);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      padding: 5px;
      font-family: var(--font-stack);
      font-size: 13.5px;
    }
    .stilo-autocomplete-popover.hidden {
      display: none !important;
    }
    .stilo-ac-header {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 4px;
    }
    .stilo-ac-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-color);
      transition: background 0.1s ease;
    }
    .stilo-ac-item .ac-icon {
      font-size: 14px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .stilo-ac-item .ac-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stilo-ac-item:hover, .stilo-ac-item.selected {
      background: var(--accent-color, #7B2CBF);
      color: #ffffff;
    }

    body.read-only #editor {
      cursor: default;
      user-select: text;
    }
    body.read-only .table-handle,
    body.read-only .image-handle,
    body.read-only .col-resize-handle {
      display: none !important;
    }
    body.read-only .stilo-task input[type="checkbox"] {
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="editor-container">
    <div id="editor" contenteditable="true" spellcheck="true"></div>
  </div>

  <div id="stilo-autocomplete-popover" class="stilo-autocomplete-popover hidden">
    <div id="stilo-ac-header" class="stilo-ac-header">Suggestions</div>
    <div id="stilo-ac-list" class="stilo-ac-list"></div>
  </div>



  <script>
    window.addEventListener('error', (e) => console.error('TeddyNotes JS Error:', e.message, e.filename, e.lineno, e.error));
    var editor = document.getElementById('editor');
    let saveTimeout = null;
    let isUpdatingFromPython = false;
    let lastSavedHtml = '';
    let lastSavedTitle = '';

    let lastActiveTable = null;
    let lastActiveTableWrap = null;
    let lastActiveCell = null;
    let lastActiveImage = null;
    let selectionRaf = 0;

    function clearTableActive() {
      if (lastActiveTableWrap) {
        lastActiveTableWrap.classList.remove('table-active');
        lastActiveTableWrap = null;
      }
      lastActiveTable = null;
    }

    function clearImageActive() {
      if (lastActiveImage) {
        lastActiveImage.classList.remove('img-active');
        lastActiveImage = null;
      }
    }

    function setTableActive(table) {
      if (!table) return;
      lastActiveTable = table;
      const wrap = table.closest('.stilo-table-wrapper') || table;
      if (lastActiveTableWrap && lastActiveTableWrap !== wrap) {
        lastActiveTableWrap.classList.remove('table-active');
      }
      lastActiveTableWrap = wrap;
      wrap.classList.add('table-active');
      if (lastActiveImage) {
        lastActiveImage.classList.remove('img-active');
        lastActiveImage = null;
      }
    }

    function setImageActive(imgWrapper) {
      if (!imgWrapper) return;
      if (lastActiveImage && lastActiveImage !== imgWrapper) {
        lastActiveImage.classList.remove('img-active');
      }
      lastActiveImage = imgWrapper;
      imgWrapper.classList.add('img-active');
      if (lastActiveTableWrap) {
        lastActiveTableWrap.classList.remove('table-active');
        lastActiveTableWrap = null;
        lastActiveTable = null;
      }
    }

    let isResizingTable = false;
    let resizingTableEl = null;
    let tableStartX = 0;
    let tableStartWidth = 0;

    let isResizingCol = false;
    let resizingColEl = null;
    let colStartX = 0;
    let colStartWidth = 0;

    let isResizingImg = false;
    let resizingImgEl = null;
    let imgStartX = 0;
    let imgStartWidth = 0;

    let lastEditorRange = null;

    function getValidCellNodes(cell) {
      if (!cell) return [];
      return Array.from(cell.childNodes).filter(n => {
        return !(n.nodeType === 1 && n.classList.contains('col-resize-handle'));
      });
    }

    function setRangeBoundaryInsideCell(range, cell, isStart) {
      if (!range || !cell) return;
      const validNodes = getValidCellNodes(cell);
      if (validNodes.length === 0) {
        if (isStart) range.setStart(cell, 0);
        else range.setEnd(cell, 0);
        return;
      }
      if (isStart) {
        const first = validNodes[0];
        range.setStart(first, 0);
      } else {
        const last = validNodes[validNodes.length - 1];
        const len = (last.nodeType === Node.TEXT_NODE ? last.textContent.length : last.childNodes.length);
        range.setEnd(last, len);
      }
    }

    function selectCellContent(cell) {
      if (!cell) return null;
      const table = cell.closest('table.stilo-table');
      if (table && document.activeElement !== table && typeof table.focus === 'function') {
        table.focus();
      }
      const range = document.createRange();
      setRangeBoundaryInsideCell(range, cell, true);
      setRangeBoundaryInsideCell(range, cell, false);

      const sel = window.getSelection();
      if (sel) {
        sel.removeAllRanges();
        sel.addRange(range);
      }
      lastEditorRange = range.cloneRange();
      return range;
    }

    function normalizeTableRange(range) {
      if (!range) return range;
      try {
        let sc = range.startContainer;
        let ec = range.endContainer;
        let so = range.startOffset;
        let eo = range.endOffset;

        // If either boundary is a TR
        if (sc.nodeName === 'TR' || ec.nodeName === 'TR') {
          const tr = sc.nodeName === 'TR' ? sc : ec;
          const cells = Array.from(tr.children).filter(c => c.matches('td, th'));
          if (cells.length > 0) {
            const startIdx = sc.nodeName === 'TR' ? Math.min(so, cells.length - 1) : 0;
            const endIdx = ec.nodeName === 'TR' ? Math.max(0, Math.min(eo - 1, cells.length - 1)) : cells.length - 1;
            const firstCell = cells[startIdx];
            const lastCell = cells[endIdx];

            if (firstCell && lastCell) {
              const normRange = document.createRange();
              setRangeBoundaryInsideCell(normRange, firstCell, true);
              setRangeBoundaryInsideCell(normRange, lastCell, false);
              return normRange;
            }
          }
        }

        // If either boundary is TBODY, THEAD, or TABLE
        if (['TABLE', 'TBODY', 'THEAD'].includes(sc.nodeName) || ['TABLE', 'TBODY', 'THEAD'].includes(ec.nodeName)) {
          const table = (sc.closest ? sc.closest('table.stilo-table') : sc.parentElement?.closest('table.stilo-table'));
          if (table) {
            const cells = Array.from(table.querySelectorAll('td, th'));
            if (cells.length > 0) {
              const normRange = document.createRange();
              setRangeBoundaryInsideCell(normRange, cells[0], true);
              setRangeBoundaryInsideCell(normRange, cells[cells.length - 1], false);
              return normRange;
            }
          }
        }

        // If boundary is a cell that contains .col-resize-handle
        const cell = (sc.nodeType === 1 ? sc : sc.parentElement)?.closest('td, th');
        if (cell) {
          const handle = cell.querySelector(':scope > .col-resize-handle');
          if (handle) {
            if (ec === cell && eo >= Array.from(cell.childNodes).indexOf(handle)) {
              const normRange = range.cloneRange();
              normRange.setEndBefore(handle);
              return normRange;
            }
            if (handle.contains(ec) || ec === handle) {
              const normRange = range.cloneRange();
              normRange.setEndBefore(handle);
              return normRange;
            }
          }
        }
      } catch (err) {
        console.warn('normalizeTableRange error:', err);
      }
      return range;
    }

    function saveCurrentRange() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (editor && editor.contains(range.commonAncestorContainer)) {
          lastEditorRange = normalizeTableRange(range).cloneRange();
        }
      }
    }

    function restoreSelectionIfNeeded() {
      const sel = window.getSelection();
      let range = null;
      if (sel && sel.rangeCount > 0) {
        const testRange = sel.getRangeAt(0);
        if (editor && editor.contains(testRange.commonAncestorContainer)) {
          range = normalizeTableRange(testRange);
        }
      }
      if ((!range || (range.collapsed && lastEditorRange && !lastEditorRange.collapsed)) &&
          lastEditorRange && editor && editor.contains(lastEditorRange.commonAncestorContainer)) {
        range = normalizeTableRange(lastEditorRange);
        if (sel) {
          sel.removeAllRanges();
          sel.addRange(range);
        }
      }
      if (range) {
        const containerNode = range.commonAncestorContainer;
        const editableEl = (containerNode.nodeType === 1 ? containerNode : containerNode.parentElement)?.closest('[contenteditable="true"]') || editor;
        if (document.activeElement !== editableEl && typeof editableEl.focus === 'function') {
          editableEl.focus();
          if (sel) {
            sel.removeAllRanges();
            sel.addRange(range);
          }
        }
      }
      return range;
    }

    document.addEventListener('selectionchange', () => {
      saveCurrentRange();
      if (selectionRaf) return;
      selectionRaf = requestAnimationFrame(() => {
        selectionRaf = 0;
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        let node = sel.getRangeAt(0).commonAncestorContainer;
        if (node.nodeType === 3) node = node.parentNode;
        if (!node || !node.closest) return;
        const table = node.closest('table.stilo-table');
        const cell = node.closest('td, th');
        const imgWrapper = node.closest('.stilo-img-wrapper');
        if (table) {
          setTableActive(table);
        }
        if (cell) {
          lastActiveCell = cell;
        }
        if (imgWrapper) {
          setImageActive(imgWrapper);
        }
      });
    });

    // ==========================================
    // Undo / Redo Stack Management
    // ==========================================
    let undoStack = [];
    let redoStack = [];
    let isUndoRedoAction = false;
    let typingDebounceTimer = null;
    let lastPushedHtml = '';

    function initUndoStack() {
      const current = editor.innerHTML;
      undoStack = [current];
      redoStack = [];
      lastPushedHtml = current;
    }

    function saveUndoState() {
      if (isUndoRedoAction || isUpdatingFromPython) return;
      const current = editor.innerHTML;
      if (current === lastPushedHtml) return;

      undoStack.push(current);
      lastPushedHtml = current;
      if (undoStack.length > 100) {
        undoStack.shift();
      }
      redoStack = [];
    }

    function restoreCursorAtEnd() {
      try {
        const sel = window.getSelection();
        if (sel) {
          const range = document.createRange();
          range.selectNodeContents(editor);
          range.collapse(false);
          sel.removeAllRanges();
          sel.addRange(range);
        }
      } catch (e) {
        console.error("Cursor restore error:", e);
      }
    }

    function performUndo() {
      const current = editor.innerHTML;
      // If there are uncommitted typing changes not yet pushed to undoStack
      if (undoStack.length > 0 && current !== undoStack[undoStack.length - 1]) {
        redoStack.push(current);
        const stateToRestore = undoStack[undoStack.length - 1];
        isUndoRedoAction = true;
        editor.innerHTML = stateToRestore;
        lastPushedHtml = stateToRestore;
        initAllHandles();
        notifyChange();
        isUndoRedoAction = false;
        editor.focus();
        restoreCursorAtEnd();
        return true;
      }

      if (undoStack.length > 1) {
        isUndoRedoAction = true;
        const currentState = undoStack.pop();
        redoStack.push(currentState);

        const prevState = undoStack[undoStack.length - 1];
        editor.innerHTML = prevState;
        lastPushedHtml = prevState;
        initAllHandles();
        notifyChange();
        isUndoRedoAction = false;
        editor.focus();
        restoreCursorAtEnd();
        return true;
      }
      return false;
    }

    function performRedo() {
      if (redoStack.length > 0) {
        isUndoRedoAction = true;
        const nextState = redoStack.pop();
        undoStack.push(nextState);
        lastPushedHtml = nextState;

        editor.innerHTML = nextState;
        initAllHandles();
        notifyChange();
        isUndoRedoAction = false;
        editor.focus();
        restoreCursorAtEnd();
        return true;
      }
      return false;
    }

    // ==========================================
    // Title Selection & Focus for Note
    // ==========================================
    let userInteractedWithCurrentNote = false;

    function isUntitledTitleText(text) {
      if (!text) return true;
      const trimmed = text.trim();
      if (!trimmed || trimmed.toLowerCase() === 'untitled') return true;
      return /^Untitled Note(\s+\d+)?$/i.test(trimmed);
    }

    function selectUntitledTitle() {
      const doSelect = () => {
        if (userInteractedWithCurrentNote) return;
        try {
          window.focus();
          editor.focus();
          const h1 = editor.querySelector('h1');
          if (h1) {
            const text = h1.textContent.trim();
            if (isUntitledTitleText(text)) {
              const sel = window.getSelection();
              if (!sel.rangeCount || sel.isCollapsed || (sel.anchorNode && h1.contains(sel.anchorNode))) {
                const range = document.createRange();
                range.selectNodeContents(h1);
                sel.removeAllRanges();
                sel.addRange(range);
              }
            }
          }
        } catch (e) {
          console.error("selectUntitledTitle error:", e);
        }
      };

      doSelect();
      requestAnimationFrame(doSelect);
      setTimeout(doSelect, 60);
      setTimeout(doSelect, 180);
    }

    function focusEditor() {
      if (isReadOnlyMode) return;
      try {
        window.focus();
        editor.focus();
        if (userInteractedWithCurrentNote) return;
        const h1 = editor.querySelector('h1');
        if (h1) {
          const text = h1.textContent.trim();
          if (isUntitledTitleText(text)) {
            selectUntitledTitle();
            return;
          }
          setCursorAtEnd(h1);
        }
      } catch (e) {
        console.error("focusEditor error:", e);
      }
    }

    // ==========================================
    // Keyboard-Oriented Autocomplete: ##, /, #, @, [[
    // ==========================================
    let autocompleteData = {
      categories: [],
      tags: [],
      notes: [],
      mentions: []
    };

    let acState = {
      active: false,
      triggerType: null, // 'tag', 'category', 'mention', 'wiki'
      query: '',
      matchStr: '',
      items: [],
      selectedIndex: 0,
      targetNode: null,
      startOffset: 0,
      endOffset: 0
    };

    window.setAutocompleteData = function(data) {
      if (!data) return;
      if (Array.isArray(data.categories)) autocompleteData.categories = data.categories;
      if (Array.isArray(data.tags)) autocompleteData.tags = data.tags;
      if (Array.isArray(data.notes)) autocompleteData.notes = data.notes;
      if (Array.isArray(data.mentions)) autocompleteData.mentions = data.mentions;
    };

    function checkAutocompleteTrigger() {
      const sel = window.getSelection();
      if (!sel.rangeCount || !sel.isCollapsed) {
        hideAutocomplete();
        return;
      }
      const range = sel.getRangeAt(0);
      const node = range.startContainer;
      if (!node || node.nodeType !== Node.TEXT_NODE) {
        hideAutocomplete();
        return;
      }

      if (node.parentElement && (node.parentElement.closest('pre') || node.parentElement.closest('code'))) {
        hideAutocomplete();
        return;
      }

      const text = node.textContent;
      const offset = range.startOffset;
      const textBefore = text.slice(0, offset);

      const wikiMatch = textBefore.match(/(?:^|\s)\[\[([^\]\n]*)$/);
      const catHashMatch = textBefore.match(/(?<!#)##([a-zA-Z0-9_\-/]*)$/);
      const catSlashMatch = textBefore.match(/(?:^|\s)\/([a-zA-Z0-9_\-/]*)$/);
      const tagMatch = textBefore.match(/(?<![#\w])#([a-zA-Z0-9_\-]*)$/);
      const mentionMatch = textBefore.match(/(?<![\w@])@([a-zA-Z0-9_\.\-]*)$/);

      let triggerType = null;
      let query = '';
      let matchStr = '';

      if (wikiMatch) {
        triggerType = 'wiki';
        query = wikiMatch[1];
        matchStr = wikiMatch[0].trimStart();
      } else if (catHashMatch) {
        triggerType = 'category';
        query = catHashMatch[1];
        matchStr = catHashMatch[0];
      } else if (catSlashMatch) {
        triggerType = 'category';
        query = catSlashMatch[1];
        matchStr = catSlashMatch[0].trimStart();
      } else if (tagMatch) {
        triggerType = 'tag';
        query = tagMatch[1];
        matchStr = tagMatch[0];
      } else if (mentionMatch) {
        triggerType = 'mention';
        query = mentionMatch[1];
        matchStr = mentionMatch[0];
      }

      if (!triggerType) {
        hideAutocomplete();
        return;
      }

      const suggestions = [];
      const qLower = query.toLowerCase();

      if (triggerType === 'tag') {
        const matching = autocompleteData.tags.filter(t => t.toLowerCase().includes(qLower));
        for (const t of matching) {
          suggestions.push({ label: '#' + t, value: t, type: 'tag', icon: '🏷️' });
        }
        if (query && !matching.some(t => t.toLowerCase() === qLower)) {
          suggestions.unshift({ label: `Create Tag "#${query}"`, value: query, type: 'tag', icon: '✨' });
        }
      } else if (triggerType === 'category') {
        const matching = autocompleteData.categories.filter(c => c.toLowerCase().includes(qLower));
        for (const c of matching) {
          suggestions.push({ label: c, value: c, type: 'category', icon: '📁' });
        }
        if (query && !matching.some(c => c.toLowerCase() === qLower)) {
          suggestions.unshift({ label: `Set Category to "${query}"`, value: query, type: 'category', icon: '✨' });
        }
      } else if (triggerType === 'mention') {
        const matching = (autocompleteData.mentions || []).filter(m => m.toLowerCase().includes(qLower));
        for (const m of matching) {
          suggestions.push({ label: '@' + m, value: m, type: 'mention', icon: '👤' });
        }
        if (query) {
          suggestions.unshift({ label: `Mention "@${query}"`, value: query, type: 'mention', icon: '👤' });
        }
      } else if (triggerType === 'wiki') {
        const matching = autocompleteData.notes.filter(n => n.toLowerCase().includes(qLower));
        for (const n of matching) {
          suggestions.push({ label: n, value: n, type: 'wiki', icon: '📄' });
        }
        if (query && !matching.some(n => n.toLowerCase() === qLower)) {
          suggestions.unshift({ label: `Create Note "[[${query}]]"`, value: query, type: 'wiki', icon: '✨' });
        }
      }

      if (suggestions.length === 0) {
        hideAutocomplete();
        return;
      }

      acState.active = true;
      acState.triggerType = triggerType;
      acState.query = query;
      acState.matchStr = matchStr;
      acState.items = suggestions;
      acState.selectedIndex = 0;
      acState.targetNode = node;
      acState.endOffset = offset;
      acState.startOffset = offset - matchStr.length;

      renderAutocomplete(range);
    }

    function renderAutocomplete(range) {
      const popover = document.getElementById('stilo-autocomplete-popover');
      const header = document.getElementById('stilo-ac-header');
      const list = document.getElementById('stilo-ac-list');
      if (!popover || !list) return;

      const titles = {
        'tag': 'Tags (Select or Enter)',
        'category': 'Categories (Select or Enter)',
        'mention': 'Mentions',
        'wiki': 'Internal Note Links'
      };
      if (header) header.textContent = titles[acState.triggerType] || 'Suggestions';

      list.innerHTML = '';
      acState.items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'stilo-ac-item' + (index === acState.selectedIndex ? ' selected' : '');
        div.innerHTML = `<span class="ac-icon">${item.icon}</span><span class="ac-label">${escapeHtml(item.label)}</span>`;
        div.addEventListener('mousedown', (e) => {
          e.preventDefault();
          applyAutocomplete(index);
        });
        list.appendChild(div);
      });

      popover.classList.remove('hidden');
      try {
        const rect = range.getBoundingClientRect();
        let top = rect.bottom + window.scrollY + 6;
        let left = rect.left + window.scrollX;
        const popWidth = popover.offsetWidth || 240;
        const popHeight = popover.offsetHeight || 180;

        if (left + popWidth > window.innerWidth - 16) {
          left = Math.max(16, window.innerWidth - popWidth - 16);
        }
        if (rect.bottom + popHeight > window.innerHeight && rect.top - popHeight > 0) {
          top = rect.top + window.scrollY - popHeight - 6;
        }

        popover.style.top = top + 'px';
        popover.style.left = left + 'px';
      } catch (e) {
        console.error('Positioning error:', e);
      }
    }

    function hideAutocomplete() {
      acState.active = false;
      const popover = document.getElementById('stilo-autocomplete-popover');
      if (popover) popover.classList.add('hidden');
    }

    function selectNextAutocomplete() {
      if (!acState.active || !acState.items.length) return;
      acState.selectedIndex = (acState.selectedIndex + 1) % acState.items.length;
      updateAutocompleteSelection();
    }

    function selectPrevAutocomplete() {
      if (!acState.active || !acState.items.length) return;
      acState.selectedIndex = (acState.selectedIndex - 1 + acState.items.length) % acState.items.length;
      updateAutocompleteSelection();
    }

    function updateAutocompleteSelection() {
      const list = document.getElementById('stilo-ac-list');
      if (!list) return;
      const items = list.querySelectorAll('.stilo-ac-item');
      items.forEach((el, idx) => {
        if (idx === acState.selectedIndex) {
          el.classList.add('selected');
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.classList.remove('selected');
        }
      });
    }

    function applyAutocomplete(index = null) {
      if (!acState.active) return;
      const idx = (index !== null) ? index : acState.selectedIndex;
      const item = acState.items[idx];
      if (!item) {
        hideAutocomplete();
        return;
      }

      const node = acState.targetNode;
      if (!node || !node.parentNode) {
        hideAutocomplete();
        return;
      }

      const text = node.textContent;
      const before = text.slice(0, acState.startOffset);
      const after = text.slice(acState.endOffset);

      let insertFragment = null;

      if (item.type === 'tag') {
        const cleanTag = item.value.replace(/^#+/, '').trim();
        insertFragment = document.createElement('span');
        insertFragment.className = 'stilo-tag';
        insertFragment.setAttribute('data-tag', cleanTag);
        insertFragment.textContent = '#' + cleanTag;
        if (!autocompleteData.tags.includes(cleanTag)) {
          autocompleteData.tags.push(cleanTag);
        }
      } else if (item.type === 'category') {
        const cleanCat = item.value.replace(/^[#/]+/, '').trim();
        insertFragment = document.createElement('span');
        insertFragment.className = 'stilo-category-badge';
        insertFragment.setAttribute('data-category', cleanCat);
        insertFragment.innerHTML = `📁 ${escapeHtml(cleanCat)}`;
        if (!autocompleteData.categories.includes(cleanCat)) {
          autocompleteData.categories.push(cleanCat);
        }
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.categorySelected) {
          window.webkit.messageHandlers.categorySelected.postMessage(cleanCat);
        }
      } else if (item.type === 'mention') {
        const cleanMention = item.value.replace(/^@+/, '').trim();
        insertFragment = document.createElement('span');
        insertFragment.className = 'stilo-mention';
        insertFragment.setAttribute('data-mention', cleanMention);
        insertFragment.textContent = '@' + cleanMention;
        if (!autocompleteData.mentions.includes(cleanMention)) {
          autocompleteData.mentions.push(cleanMention);
        }
      } else if (item.type === 'wiki') {
        const title = item.value.trim();
        insertFragment = document.createElement('a');
        insertFragment.className = 'stilo-wiki-link';
        insertFragment.href = 'teddy-note://' + encodeURIComponent(title);
        insertFragment.setAttribute('data-note-title', title);
        insertFragment.textContent = title;
        if (!autocompleteData.notes.includes(title)) {
          autocompleteData.notes.push(title);
        }
      }

      const space = document.createTextNode('\u00A0');
      const existingBadge = node.parentElement ? node.parentElement.closest('.stilo-tag, .stilo-category-badge, .stilo-mention') : null;

      if (existingBadge) {
        const badgeParent = existingBadge.parentNode;
        const afterNode = document.createTextNode(after);
        badgeParent.insertBefore(insertFragment, existingBadge.nextSibling);
        badgeParent.insertBefore(space, insertFragment.nextSibling);
        if (after) {
          badgeParent.insertBefore(afterNode, space.nextSibling);
        }
        existingBadge.remove();
      } else {
        const parent = node.parentNode;
        node.textContent = before;
        const afterNode = document.createTextNode(after);

        parent.insertBefore(insertFragment, node.nextSibling);
        parent.insertBefore(space, insertFragment.nextSibling);
        parent.insertBefore(afterNode, space.nextSibling);
      }

      const newRange = document.createRange();
      newRange.setStart(space, 1);
      newRange.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(newRange);

      hideAutocomplete();
      notifyChange();
    }

    window.addEventListener('load', () => {
      setupEventHandlers();
      initAllHandles();
      initUndoStack();
      focusEditor();
    });

    function setupEventHandlers() {
      editor.addEventListener('pointerdown', () => { userInteractedWithCurrentNote = true; });
      editor.addEventListener('input', (e) => {
        userInteractedWithCurrentNote = true;
        onEditorInput(e);
        checkAutocompleteTrigger();
      });
      editor.addEventListener('keydown', (e) => {
        if (isReadOnlyMode) {
          if (e.ctrlKey || e.metaKey) {
            const keyLower = e.key.toLowerCase();
            if (keyLower === 'c' || keyLower === 'a') {
              return;
            }
          }
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) {
            return;
          }
          e.preventDefault();
          return;
        }
        userInteractedWithCurrentNote = true;
        if (acState.active) {
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            e.stopPropagation();
            selectNextAutocomplete();
            return;
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            e.stopPropagation();
            selectPrevAutocomplete();
            return;
          } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            e.stopPropagation();
            applyAutocomplete();
            return;
          } else if (e.key === 'Escape') {
            e.preventDefault();
            e.stopPropagation();
            hideAutocomplete();
            return;
          }
        }
        onKeyDown(e);
      });
      editor.addEventListener('keyup', (e) => {
        if (e.target && (e.target.closest('table.stilo-table') || e.target.closest('.stilo-img-wrapper'))) {
          updateActiveElement(e);
        }
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#stilo-autocomplete-popover')) {
          hideAutocomplete();
        }
      });
      editor.addEventListener('click', onEditorClick);
      const container = document.getElementById('editor-container');
      if (container) {
        container.addEventListener('click', (e) => {
          const sel = window.getSelection();
          if (sel && !sel.isCollapsed) return;

          if (e.target === container || e.target === editor) {
            const last = editor.lastElementChild;
            if (last && typeof e.clientY === 'number') {
              const lastRect = last.getBoundingClientRect();
              if (e.clientY <= lastRect.bottom) {
                return;
              }
            }
            ensureBlocksHaveTrailingLine();
            const newLast = editor.lastElementChild;
            if (newLast) {
              setCursorAtEnd(newLast);
            }
          }
        });
      }
      editor.addEventListener('paste', onPaste);
      editor.addEventListener('drop', onDrop);
      editor.addEventListener('blur', () => {
        hideAutocomplete();
        const block = getClosestBlockElement();
        if (block && hasMarkdownSyntax(block.textContent, true)) {
          convertMarkdownInBlock(block, true);
        }
      });

      function handleTableCellMultiClick(e) {
        if (e.detail >= 3) {
          const cell = e.target.closest('td, th');
          if (cell) {
            e.preventDefault();
            selectCellContent(cell);
          }
        }
      }

      editor.addEventListener('pointerdown', handleTableCellMultiClick);
      editor.addEventListener('mousedown', handleTableCellMultiClick);
      editor.addEventListener('click', handleTableCellMultiClick);

      editor.addEventListener('click', updateActiveElement);
      editor.addEventListener('pointerdown', (e) => {
        const imgWrapper = e.target.closest('.stilo-img-wrapper');
        const table = e.target.closest('table.stilo-table');
        if (imgWrapper || table) {
          updateActiveElement(e);
        }
      });


      window.addEventListener('blur', () => {
        clearTimeout(saveTimeout);
        notifyChange();
      });
      editor.addEventListener('blur', () => {
        clearTimeout(saveTimeout);
        notifyChange();
      });

      // Resize handle start, move, and end listeners supporting mouse and pointer events
      const handleResizeStart = (e) => {
        const imgH = e.target.closest('.image-handle');
        if (imgH) {
          e.preventDefault();
          e.stopPropagation();
          const wrap = imgH.closest('.stilo-img-wrapper');
          if (!wrap) return;
          setImageActive(wrap);
          isResizingImg = true;
          resizingImgEl = wrap;
          imgStartX = e.clientX;
          const rect = wrap.getBoundingClientRect ? wrap.getBoundingClientRect() : null;
          imgStartWidth = (rect && rect.width) || wrap.offsetWidth || parseInt(wrap.style.width) || 300;
          document.body.style.cursor = 'nwse-resize';
          document.body.style.userSelect = 'none';
          if (e.pointerId && imgH.setPointerCapture) {
            try { imgH.setPointerCapture(e.pointerId); } catch (_) {}
          }
          return;
        }

        const tblH = e.target.closest('.table-handle');
        if (tblH) {
          e.preventDefault();
          e.stopPropagation();
          const wrap = tblH.closest('.stilo-table-wrapper');
          if (!wrap) return;
          lastActiveTable = wrap.querySelector('table');
          setTableActive(lastActiveTable || wrap);
          isResizingTable = true;
          resizingTableEl = wrap;
          tableStartX = e.clientX;
          const rect = wrap.getBoundingClientRect ? wrap.getBoundingClientRect() : null;
          tableStartWidth = (rect && rect.width) || wrap.offsetWidth || parseInt(wrap.style.width) || 400;
          document.body.style.cursor = 'nwse-resize';
          document.body.style.userSelect = 'none';
          if (e.pointerId && tblH.setPointerCapture) {
            try { tblH.setPointerCapture(e.pointerId); } catch (_) {}
          }
          return;
        }

        const colH = e.target.closest('.col-resize-handle');
        if (colH) {
          e.preventDefault();
          e.stopPropagation();
          const cell = colH.closest('th, td');
          if (!cell) return;
          isResizingCol = true;
          resizingColEl = cell;
          colStartX = e.clientX;
          colStartWidth = cell.offsetWidth;
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          if (e.pointerId && colH.setPointerCapture) {
            try { colH.setPointerCapture(e.pointerId); } catch (_) {}
          }
          return;
        }
      };

      document.addEventListener('pointerdown', handleResizeStart, true);

      const handleResizeMove = (e) => {
        if (isResizingTable && resizingTableEl) {
          e.preventDefault();
          const deltaX = e.clientX - tableStartX;
          const maxW = editor.clientWidth ? (editor.clientWidth - 20) : 720;
          const newWidth = Math.max(120, Math.min(maxW, Math.round(tableStartWidth + deltaX)));
          resizingTableEl.style.width = newWidth + 'px';
          const tbl = resizingTableEl.querySelector('table');
          if (tbl) tbl.style.width = '100%';
        }
        if (isResizingCol && resizingColEl) {
          e.preventDefault();
          const deltaX = e.clientX - colStartX;
          const newWidth = Math.max(30, Math.round(colStartWidth + deltaX));
          resizingColEl.style.width = newWidth + 'px';
          resizingColEl.style.minWidth = newWidth + 'px';
          const tbl = resizingColEl.closest('table');
          if (tbl) tbl.style.tableLayout = 'fixed';
        }
        if (isResizingImg && resizingImgEl) {
          e.preventDefault();
          const deltaX = e.clientX - imgStartX;
          const maxW = editor.clientWidth ? (editor.clientWidth - 20) : 720;
          const newWidth = Math.max(60, Math.min(maxW, Math.round(imgStartWidth + deltaX)));
          resizingImgEl.style.width = newWidth + 'px';
          const img = resizingImgEl.querySelector('img');
          if (img) {
            img.style.width = '100%';
            img.style.height = 'auto';
          }
        }
      };

      document.addEventListener('pointermove', handleResizeMove);

      const handleResizeEnd = () => {
        if (isResizingTable || isResizingCol || isResizingImg) {
          isResizingTable = false;
          resizingTableEl = null;
          isResizingCol = false;
          resizingColEl = null;
          isResizingImg = false;
          resizingImgEl = null;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          notifyChange();
        }
      };

      document.addEventListener('pointerup', handleResizeEnd);

      const onOutsideClick = (e) => {
        if (!e.target.closest('#floating-toolbar') && !e.target.closest('.stilo-table-wrapper') && !e.target.closest('.stilo-img-wrapper')) {
          clearTableActive();
          clearImageActive();
        }
      };
      document.addEventListener('click', onOutsideClick);
      document.addEventListener('pointerdown', onOutsideClick);
    }

    function initTableHandles(table) {
      if (!table) return;

      // Wrap in .stilo-table-wrapper if not already wrapped
      let wrapper = table.parentElement;
      if (!wrapper || !wrapper.classList.contains('stilo-table-wrapper')) {
        wrapper = document.createElement('div');
        wrapper.className = 'stilo-table-wrapper';
        wrapper.setAttribute('contenteditable', 'false');
        if (table.style.width) {
          wrapper.style.width = table.style.width;
          table.style.width = '100%';
        }
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      }
      wrapper.setAttribute('contenteditable', 'false');
      table.setAttribute('contenteditable', 'true');

      let handle = wrapper.querySelector(':scope > .table-handle');
      if (!handle) {
        handle = document.createElement('div');
        handle.className = 'table-handle';
        handle.setAttribute('contenteditable', 'false');
        handle.setAttribute('draggable', 'false');
        handle.title = 'Drag to resize table width';
        wrapper.appendChild(handle);
      }

      const headers = table.querySelectorAll('th, thead td, tr:first-child td');
      headers.forEach(cell => {
        let colHandle = cell.querySelector(':scope > .col-resize-handle');
        if (!colHandle) {
          colHandle = document.createElement('div');
          colHandle.className = 'col-resize-handle';
          colHandle.setAttribute('contenteditable', 'false');
          colHandle.setAttribute('draggable', 'false');
          colHandle.title = 'Drag to resize column';
          cell.appendChild(colHandle);
        }
      });
    }

    function initImageHandles(wrapper) {
      if (!wrapper) return;
      wrapper.setAttribute('contenteditable', 'false');
      const img = wrapper.querySelector('img');
      if (img) {
        img.setAttribute('draggable', 'false');
        img.addEventListener('dragstart', (e) => e.preventDefault());
      }

      let handle = wrapper.querySelector(':scope > .image-handle');
      if (!handle) {
        handle = document.createElement('div');
        handle.className = 'image-handle';
        handle.setAttribute('contenteditable', 'false');
        handle.setAttribute('draggable', 'false');
        handle.title = 'Drag to resize image';
        wrapper.appendChild(handle);
      }
    }

    function ensureBlocksHaveTrailingLine() {
      if (!editor) return;
      const blocks = editor.querySelectorAll('.stilo-table-wrapper, table.stilo-table, .stilo-img-wrapper, pre.stilo-code-block');
      blocks.forEach(b => {
        const target = b.closest('.stilo-table-wrapper') || b.closest('.stilo-img-wrapper') || b;
        const next = target.nextElementSibling;
        if (!next || next.classList.contains('stilo-table-wrapper') ||
            next.classList.contains('stilo-img-wrapper') ||
            next.classList.contains('stilo-code-block') ||
            next.tagName === 'TABLE' || next.tagName === 'PRE') {
          const div = document.createElement('div');
          div.innerHTML = '<br>';
          target.parentNode.insertBefore(div, target.nextSibling);
        }
      });
    }

    function initAllHandles() {
      // Auto-wrap any standalone <img> into .stilo-img-wrapper
      editor.querySelectorAll('img').forEach(img => {
        if (!img.closest('.stilo-img-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.className = 'stilo-img-wrapper';
          wrapper.setAttribute('contenteditable', 'false');
          if (img.style.width) {
            wrapper.style.width = img.style.width;
            img.style.width = '100%';
          }
          img.parentNode.insertBefore(wrapper, img);
          wrapper.appendChild(img);
        }
      });

      editor.querySelectorAll('table.stilo-table').forEach(initTableHandles);
      editor.querySelectorAll('.stilo-img-wrapper').forEach(initImageHandles);
      ensureBlocksHaveTrailingLine();
    }

    function updateActiveElement(e) {
      const target = e.target;
      if (!target || !target.closest) return;
      const table = target.closest('table.stilo-table');
      const cell = target.closest('td, th');
      const imgWrapper = target.closest('.stilo-img-wrapper');

      if (table) {
        setTableActive(table);
      }
      if (cell) {
        lastActiveCell = cell;
      }
      if (imgWrapper) {
        setImageActive(imgWrapper);
      }
    }

    let isConvertingMarkdown = false;

    const EMOJI_MAP = {

      ':laughing:': '😆', ':innocent:': '😇', ':wink:': '😉', ':blush:': '😊',
      ':heart_eyes:': '😍', ':kissing_heart:': '😘', ':sunglasses:': '😎',
      ':thinking:': '🤔', ':flushed:': '😳', ':cry:': '😢', ':sob:': '😭',
      ':fire:': '🔥', ':star:': '⭐', ':sparkles:': '✨', ':tada:': '🎉',
      ':rocket:': '🚀', ':check:': '✓', ':white_check_mark:': '✅',
      ':x:': '❌', ':warning:': '⚠️', ':bulb:': '💡', ':heart:': '❤️',
