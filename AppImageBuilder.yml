version: 1
script:
  - meson setup build --prefix=/usr --buildtype=release
  - meson install -C build --destdir "$TARGET_APPDIR"

AppDir:
  path: ./AppDir
  app_info:
    id: io.github.fastrizwaan.TeddyNotes
    name: TeddyNotes
    icon: io.github.fastrizwaan.TeddyNotes
    version: 1.7
    exec: usr/bin/teddynotes
    exec_args: "$@"
  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main universe'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-gi
      - python3-cryptography
      - gir1.2-adw-1
      - gir1.2-gtk-4.0
      - gir1.2-webkit-6.0
      - gpg
      - librsvg2-common
    exclude:
      - adwaita-icon-theme
      - humanity-icon-theme
  runtime:
    env:
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'
      GI_TYPELIB_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0'
      GSETTINGS_SCHEMA_DIR: '${APPDIR}/usr/share/glib-2.0/schemas'
  files:
    exclude:
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

AppImage:
  arch: x86_64
